<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>How Solar Panels Work</title>
<meta name="description" content="An inquiry simulation that goes inside a solar cell: photons freeing electrons, holes, doping, the p-n junction, and experiments on what makes a cell efficient." />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Roboto+Mono:wght@400;700&family=Roboto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Spark Learning companion tokens */
    --bgMain: #F7F3EE;
    --bgCard: #FFFFFF;
    --accentBlue: #6366f1;
    --accentBlueHover: #4f46e5;
    --accentPurple: #a855f7;
    --accentGreen: #10b981;
    --accentRed: #ef4444;
    --textPrimary: #1C1917;
    --textSecondary: #57534E;
    --textWarm: #2A2520;
    --textWarmMuted: #A0937B;
    --borderColor: #E8E0D2;
    --borderSubtle: #F0EBE3;
    --shadow-sm: 0 1px 2px rgba(17,17,17,0.04), 0 1px 3px rgba(17,17,17,0.06);
    --shadow-md: 0 4px 12px rgba(17,17,17,0.06), 0 2px 4px rgba(17,17,17,0.04);
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-serif: 'Roboto Serif', Georgia, Cambria, serif;
    --font-mono: 'Roboto Mono', monospace;
    --note-bg: #fdf1c6;
    --note-ink: #2a1e08;
    --note-head: #7a3a00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--bgMain); color: var(--textPrimary); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  sub, sup { font-size: 0.68em; line-height: 0; }
  [hidden] { display: none !important; }

  /* ---- compact indigo header ---- */
  header { background: linear-gradient(145deg,#4f46e5,#6366f1); padding: 20px max(24px, calc((100vw - 1276px)/2)) 56px; position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.09) 1px, transparent 2px); background-size: 30px 30px; pointer-events: none; }
  header .titles { position: relative; }
  header .eyebrow { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: #e0e7ff; margin-bottom: 4px; }
  header h1 { font-family: var(--font-serif); font-weight: 700; font-size: clamp(24px,3vw,32px); letter-spacing: -0.032em; color: #fff; margin: 0; }
  .teacher-bar { position: relative; display: flex; align-items: center; gap: 10px; flex: none; }
  .teacher-bar[hidden] { display: none; }
  .tm-badge { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #fff; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4); padding: 6px 11px; border-radius: 999px; white-space: nowrap; }
  #stepJump { font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--textPrimary); background: #fff; border: 1px solid rgba(255,255,255,.5); border-radius: 9px; padding: 9px 10px; max-width: 250px; min-height: 40px; }

  .progress-track { max-width: 1340px; margin: -40px auto 0; padding: 0 32px; position: relative; }
  .step-line { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 8px; }
  .step-line .num, .step-line .count { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #fff; white-space: nowrap; }
  .step-line .ttl { display: none; }
  .progress-track .bar { height: 5px; background: rgba(255,255,255,.3); border-radius: 999px; overflow: hidden; }
  .progress-track .fill { height: 100%; width: 0%; background: #fff; border-radius: 999px; transition: width 350ms ease; }

  main { max-width: 1340px; margin: 0 auto; padding: 22px 32px 28px; }
  .workspace { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(320px,.92fr); gap: 24px; align-items: start; }
  .stage { background: var(--bgCard); border: 1px solid var(--borderColor); border-top: 4px solid var(--accentBlue); border-radius: 16px; box-shadow: var(--shadow-md); padding: 16px 18px; min-height: 440px; display: flex; flex-direction: column; animation: fadeUp .4s ease-out; }
  .stage-label { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accentBlue); margin-bottom: 8px; }
  .stage-body { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  canvas { display: block; width: 100%; height: auto; max-height: 340px; object-fit: contain; border-radius: 12px; touch-action: none; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 12px; }
  .notes-card { background: var(--note-bg); color: var(--note-ink); padding: 16px 22px 14px; border-radius: 14px; font-size: 16px; line-height: 1.58; box-shadow: var(--shadow-sm); }
  .notes-card .nc-tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--note-head); margin-bottom: 6px; }
  .step-heading { font-family: var(--font-serif); font-weight: 700; font-size: 21px; letter-spacing: -0.02em; color: var(--note-head); margin: 0 0 6px; outline: none; }
  .notes-card p { margin: 0; }
  .notes-card strong { font-weight: 700; color: var(--note-ink); }
  .notebook-prompt { background: #fff; border: 1px solid var(--borderColor); border-left: 4px solid var(--accentBlue); border-radius: 12px; padding: 13px 16px; display: flex; align-items: flex-start; gap: 11px; font-size: 16px; line-height: 1.5; color: var(--textSecondary); box-shadow: var(--shadow-sm); }
  .notebook-prompt .np-tag { flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; padding: 4px 8px; background: var(--accentBlue); color: #fff; border-radius: 6px; margin-top: 3px; }
  .notebook-prompt strong { color: var(--textPrimary); font-weight: 700; }

  nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  button { font-family: var(--font-sans); font-size: 16px; font-weight: 600; padding: 10px 18px; min-height: 44px; border-radius: 10px; border: 1px solid var(--borderColor); background: #fff; color: var(--textPrimary); cursor: pointer; transition: background 140ms, border-color 140ms, transform 50ms; }
  button:hover:not(:disabled) { background: var(--bgMain); border-color: var(--textWarmMuted); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accentBlue); color: #fff; border-color: var(--accentBlue); box-shadow: 0 4px 14px rgba(99,102,241,0.28); }
  button.primary:hover:not(:disabled) { background: var(--accentBlueHover); border-color: var(--accentBlueHover); }
  button.primary:disabled { background: var(--borderColor); border-color: var(--borderColor); color: var(--textSecondary); box-shadow: none; opacity: 1; }
  button:focus-visible, input:focus-visible, select:focus-visible, .step-heading:focus-visible { outline: 3px solid var(--accentBlueHover); outline-offset: 3px; }
  .btn-group { display: flex; gap: 10px; }
  button svg { vertical-align: -2px; }

  .tool-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .tool-row .row-label { font-size: 13px; font-weight: 600; color: var(--textSecondary); min-width: 118px; text-align: right; }
  .chip { font-family: var(--font-sans); font-size: 14px; font-weight: 600; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1px solid var(--borderColor); background: #fff; color: var(--textPrimary); cursor: pointer; }
  .chip:hover:not(:disabled) { border-color: var(--accentBlue); }
  .chip.active { background: var(--accentBlue); color: #fff; border-color: var(--accentBlue); }
  .chip.done:not(.active) { border-color: #86efac; color: #166534; }
  .slider-row { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 580px; margin: 0 auto; }
  .slider-row label { font-size: 14px; font-weight: 600; color: var(--textSecondary); white-space: nowrap; }
  .slider-row .val { font-family: var(--font-mono); font-size: 14px; font-weight: 700; min-width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: var(--accentBlue); min-width: 0; min-height: 30px; }
  .status-line { font-family: var(--font-sans); font-size: 14px; font-weight: 600; color: var(--textPrimary); text-align: center; line-height: 1.45; min-height: 22px; margin: 0; }
  .status-line.complete { color: #166534; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .caption { font-style: italic; font-size: 13px; color: var(--textWarmMuted); text-align: center; margin: 0; }

  .gate-status { font-size: 14px; color: var(--textSecondary); line-height: 1.45; margin: 0; }
  .gate-status.complete { color: #166534; font-weight: 600; }
  .notebook-confirm { display: flex; align-items: center; gap: 10px; font-size: 15px; line-height: 1.4; min-height: 44px; cursor: pointer; }
  .notebook-confirm input { width: 20px; height: 20px; flex: none; accent-color: var(--accentBlue); }

  /* trial log (design lab) */
  .run-log { width: 100%; border: 1px solid var(--borderColor); border-radius: 10px; background: #fff; overflow: hidden; }
  .run-log .row { display: grid; grid-template-columns: 34px 1.5fr 1fr 1fr 1fr; gap: 6px; padding: 7px 12px; font-size: 13px; border-bottom: 1px solid var(--borderSubtle); align-items: center; }
  .run-log .row:last-child { border-bottom: none; }
  .run-log .row.head { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--textWarmMuted); font-weight: 700; }
  .run-log .n { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
  .run-log .row.best { background: rgba(16,185,129,0.10); }
  .run-log .row.best .n { color: #166534; }
  .run-log .empty { padding: 12px; font-size: 13px; color: var(--textWarmMuted); text-align: center; font-style: italic; }

  /* practice, one question at a time */
  .pq-count { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accentBlue); }
  .pq-question { font-family: var(--font-serif); font-weight: 700; font-size: clamp(21px,2.3vw,26px); line-height: 1.3; letter-spacing: -0.02em; color: var(--textWarm); margin: 6px 0 14px; }
  .pq-label { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--textSecondary); display: block; margin-bottom: 6px; }
  .pq-input { font-family: var(--font-mono); font-size: 24px; width: 100%; max-width: 360px; min-height: 52px; padding: 8px 12px; border: 1px solid var(--borderColor); border-radius: 10px; background: #fff; color: var(--textPrimary); }
  .pq-choices { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
  .pq-choice { text-align: left; font-weight: 500; }
  .pq-choice.active { border-color: var(--accentBlue); background: #eef2ff; font-weight: 700; }
  .pq-hint { font-size: 14px; color: var(--textWarmMuted); margin: 8px 0 0; }
  .pq-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .pq-feedback { min-height: 26px; font-size: 16px; line-height: 1.45; margin: 10px 0 0; font-weight: 600; }
  .pq-feedback.ok { color: #166534; }
  .pq-feedback.no { color: #b91c1c; }
  .pq-solution { margin-top: 12px; padding: 12px 16px; background: var(--bgMain); border: 1px solid var(--borderColor); border-left: 4px solid var(--accentGreen); border-radius: 10px; font-size: 16px; line-height: 1.55; }
  .pq-solution[hidden] { display: none !important; }
  .pq-solution ol { margin: 0 0 8px; padding-left: 22px; }
  .pq-solution .final { font-family: var(--font-serif); font-size: 22px; font-weight: 700; color: var(--textWarm); }
  .pq-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .pq-progress { margin-top: 14px; }
  .pq-progress .bar { height: 6px; background: var(--borderSubtle); border-radius: 999px; overflow: hidden; }
  .pq-progress .fill { height: 100%; background: var(--accentGreen); border-radius: 999px; }
  .pq-progress p { font-size: 13px; color: var(--textSecondary); margin: 6px 0 0; }

  @media (max-width: 980px) {
    .workspace { grid-template-columns: minmax(0,1fr); gap: 16px; }
    .side { position: static; }
    .stage { min-height: 0; }
    main { padding-left: 16px; padding-right: 16px; }
    .progress-track { padding: 0 16px; }
    header { padding-left: 16px; padding-right: 16px; flex-wrap: wrap; }
    .teacher-bar { width: 100%; } #stepJump { flex: 1; max-width: none; }
    .tool-row .row-label { min-width: 0; width: 100%; text-align: center; }
    canvas { max-height: 300px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<header>
  <div class="titles">
    <div class="eyebrow">Solar Engineering</div>
    <h1>How Solar Panels Work</h1>
  </div>
  <div class="teacher-bar" id="teacherBar" hidden>
    <span class="tm-badge">Teacher mode</span>
    <select id="stepJump" aria-label="Jump to a step"></select>
  </div>
</header>
<div class="progress-track">
  <div class="step-line">
    <span class="now"><span class="num" id="stepNum">Step 01</span><span class="ttl" id="stepTitle"></span></span>
    <span class="count" id="stepIndicator">01 / 11</span>
  </div>
  <div class="bar"><div class="fill" id="progressFill"></div></div>
</div>

<main>
  <div class="workspace">
    <div class="stage">
      <div class="stage-label" id="stageLabel">What you see</div>
      <div class="stage-body" id="stage"></div>
    </div>
    <div class="side">
      <div class="notes-card">
        <div class="nc-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Copy Into Your Notes</div>
        <h2 class="step-heading" id="stepHeading" tabindex="-1"></h2>
        <p id="notes"></p>
      </div>
      <div class="notebook-prompt">
        <div class="np-tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>DO</div>
        <div id="notebookText"></div>
      </div>
      <label class="notebook-confirm"><input id="notebookDone" type="checkbox">My notes and notebook task are complete.</label>
      <p class="gate-status" id="gateStatus" role="status" aria-live="polite"></p>
      <nav>
        <button id="resetBtn">Back to start</button>
        <div class="btn-group">
          <button id="prevBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Back</button>
          <button id="nextBtn" class="primary">Next <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      </nav>
    </div>
  </div>
</main>

<script>
// =====================================================
//  Physics model (one source of truth for every step and the tests)
// =====================================================
const BAND_GAP = 1.1;                        // eV needed to free an electron in silicon
const photonEV = nm => 1240 / nm;           // E (eV) = 1240 / wavelength (nm)
const frees = nm => photonEV(nm) >= BAND_GAP;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => k * k * (3 - 2 * k);
function bandName(nm) {
  if (nm > 750) return 'infrared';
  if (nm < 450) return 'violet'; if (nm < 495) return 'blue'; if (nm < 570) return 'green';
  if (nm < 590) return 'yellow'; if (nm < 620) return 'orange'; return 'red';
}
// Step 1 recap panel: 10 cells in series under a lamp (b = 0..100 %)
const panelVolts = b => b <= 0 ? 0 : Math.max(0, 10 * (0.6 + 0.026 * Math.log(b / 100)));
const panelAmps = b => 0.5 * b / 100;

// Design lab: where 1000 W of sunlight goes inside one cell (simplified teaching model)
const SURFACES = [
  { id: 'none', name: 'No coating', reflect: 0.30 },
  { id: 'coat', name: 'Coating', reflect: 0.10 },
  { id: 'tex', name: 'Textured + coating', reflect: 0.03 }
];
const SPACINGS = [1, 2, 3, 4];               // mm between metal fingers
const THICKNESSES = [20, 50, 100, 180, 300]; // micrometers of silicon
const SILICON_USABLE = 0.30;                 // share of absorbed light energy silicon can turn into electricity
function cellModel(d) {
  const s = SURFACES.find(x => x.id === d.surface) || SURFACES[0];
  const shadeFrac = 0.14 / d.spacing;                 // fingers close together cast more shade
  const resistFrac = 0.015 * d.spacing * d.spacing;   // fingers far apart make electrons travel farther
  const absorbFrac = 1 - Math.exp(-d.thick / 40);     // thin silicon lets light pass through
  const collectFrac = Math.exp(-d.thick / 700);       // thick silicon lets pairs recombine first
  const S = 1000;
  const reflect = S * s.reflect, a1 = S - reflect;
  const shade = a1 * shadeFrac, a2 = a1 - shade;
  const pass = a2 * (1 - absorbFrac), a3 = a2 - pass;
  const mismatch = a3 * (1 - SILICON_USABLE), a4 = a3 - mismatch;
  const recomb = a4 * (1 - collectFrac), a5 = a4 - recomb;
  const resist = a5 * resistFrac, out = a5 - resist;
  return { eff: out / S * 100, losses: { reflect, shade, pass, mismatch, recomb, resist, out } };
}
const effText = d => cellModel(d).eff.toFixed(1);
const designKey = d => d.surface + '|' + d.spacing + '|' + d.thick;
const LAB_VARS = [['surface', 'the surface'], ['spacing', 'the finger spacing'], ['thick', 'the silicon thickness']];
// a fair test = at least 3 trials that differ only in one variable
function fairTest(rows) {
  for (const [v, name] of LAB_VARS) {
    const groups = {};
    rows.forEach(r => {
      const k = LAB_VARS.filter(([o]) => o !== v).map(([o]) => r[o]).join('|');
      (groups[k] ||= new Set()).add(String(r[v]));
    });
    for (const k in groups) if (groups[k].size >= 3) return { variable: v, name, count: groups[k].size };
  }
  return null;
}
const TARGET_EFF = 20;

// =====================================================
//  Helpers
// =====================================================
const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, attrs = {}, kids = []) {
  const n = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => { if (c != null) n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
}
function makeCanvas(stage, w, h, label) {
  const c = el('canvas', { role: 'img', 'aria-label': label || stageLabel.textContent });
  c.width = w; c.height = h;
  c.textContent = 'Interactive solar cell model. Use the labeled controls below the image.';
  stage.append(c);
  return { c, ctx: c.getContext('2d') };
}
function canvasPos(c, e) {
  const r = c.getBoundingClientRect();
  return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const rgba = (hex, a) => { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${a})`; };
const C = {
  photon: '#f59e0b', electron: '#2563eb', hole: '#e11d48', valence: '#a855f7', field: '#0d9488',
  heat: '#dc2626', volt: '#4f46e5', amp: '#0d9488', ink: '#1c1917', muted: '#78716c', line: 'rgba(87,83,78,0.45)',
  nTint: '#dbeafe', pTint: '#ffe4e6', metal: '#94a3b8', good: '#166534'
};
// one wavelength-to-color helper for every step
function wlRGB(nm) {
  if (nm > 750) return [127, 29, 29];
  let r = 0, g = 0, b = 0;
  if (nm < 440) { r = (440 - nm) / 60; b = 1; }
  else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
  else if (nm < 510) { g = 1; b = (510 - nm) / 20; }
  else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
  else if (nm < 645) { r = 1; g = (645 - nm) / 65; }
  else { r = 1; }
  return [Math.round(r * 215), Math.round(g * 190), Math.round(b * 235)];
}
const wlColor = (nm, a = 1) => { const [r, g, b] = wlRGB(nm); return `rgba(${r},${g},${b},${a})`; };
const icn = (path, size = 15, sw = 2) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
const ICON = {

  zap: icn('<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>'),

// ---- canvas drawing kit ----
function drawPill(ctx, text, x, y, color, fontSize = 13, align = 'center') {
  ctx.save();
  ctx.font = `600 ${fontSize}px Inter, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const bw = ctx.measureText(text).width + 22, bh = fontSize + 12;
  let bx = align === 'left' ? x : align === 'right' ? x - bw : x - bw / 2;
  bx = clamp(bx, 2, ctx.canvas.width - bw - 2);
  const by = clamp(y - bh / 2, 2, ctx.canvas.height - bh - 2);
  ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(17,17,17,0.10)'; ctx.shadowOffsetY = 2;
  ctx.fillStyle = '#fff'; roundRect(ctx, bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = rgba(color, 0.5); ctx.lineWidth = 1.2; roundRect(ctx, bx, by, bw, bh, bh / 2); ctx.stroke();
  ctx.fillStyle = color; ctx.fillText(text, bx + bw / 2, by + bh / 2 + 0.5);
  ctx.restore();
  return { x: bx, w: bw };
}
function drawLeader(ctx, x1, y1, x2, y2, color) {
  ctx.save(); ctx.strokeStyle = rgba(color, 0.5); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x1, y1, 3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function drawElectron(ctx, x, y, r = 7, a = 1) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = C.electron; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(x - r * 0.45, y); ctx.lineTo(x + r * 0.45, y); ctx.stroke();
  ctx.restore();
}
function drawHole(ctx, x, y, r = 7, a = 1) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = C.hole; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x - r * 0.45, y); ctx.lineTo(x + r * 0.45, y); ctx.moveTo(x, y - r * 0.45); ctx.lineTo(x, y + r * 0.45); ctx.stroke();
  ctx.restore();
}
function drawIon(ctx, x, y, sign) {
  ctx.save();
  const col = sign > 0 ? C.electron : C.hole;
  ctx.fillStyle = rgba(col, 0.12); ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.setLineDash([3, 2]);
  ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = col; ctx.font = '700 15px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(sign > 0 ? '+' : '−', x, y + 1);
  ctx.restore();
}
function drawAtom(ctx, x, y, label, kind = 'Si', r = 20) {
  ctx.save();
  const fill = kind === 'P' ? C.nTint : kind === 'B' ? C.pTint : '#f5f5f4';
  const stroke = kind === 'P' ? C.electron : kind === 'B' ? C.hole : '#a8a29e';
  ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.font = '700 13px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y + 1);
  ctx.restore();
}
function drawDot(ctx, x, y, color, r = 4) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function drawSun(ctx, x, y, r, t = 0, strength = 1) {
  ctx.save();
  if (strength < 0.02) {
    ctx.fillStyle = '#d6d3d1'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore(); return;
  }
  const glow = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 2.6);
  glow.addColorStop(0, rgba(C.photon, 0.35 * strength)); glow.addColorStop(1, rgba(C.photon, 0));
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = rgba(C.photon, 0.2 + 0.5 * strength); ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6 + t / 3000, r1 = r + 6 + Math.sin(t / 300 + i) * 2, r2 = r1 + 9;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); ctx.stroke();
  }
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  g.addColorStop(0, '#fde68a'); g.addColorStop(0.6, '#fbbf24'); g.addColorStop(1, '#f59e0b');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// a photon: short wave packet whose ripple spacing follows its wavelength
function drawPhoton(ctx, x, y, dx, dy, nm, a = 1) {
  const len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len, px = -uy, py = ux;
  const L = 56, lam = nm / 38;
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = wlColor(nm); ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  if (nm > 750) ctx.setLineDash([5, 3]);
  ctx.beginPath();
  for (let s = 0; s <= L; s += 1.5) {
    const w = Math.sin(s / lam * Math.PI * 2) * 5 * Math.sin(s / L * Math.PI);
    const qx = x - ux * s + px * w, qy = y - uy * s + py * w;
    s === 0 ? ctx.moveTo(qx, qy) : ctx.lineTo(qx, qy);
  }
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = wlColor(nm); ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawFan(ctx, x, y, r, angle, on) {
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = '#d6d3d1'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, Math.PI * 2); ctx.stroke();
  ctx.rotate(angle);
  for (let i = 0; i < 3; i++) {
    ctx.rotate(Math.PI * 2 / 3);
    ctx.fillStyle = on ? '#93c5fd' : '#cbd5e1'; ctx.strokeStyle = on ? '#3b82f6' : '#94a3b8'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(0, -r * 0.52, r * 0.24, r * 0.5, 0.25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#57534e'; ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, Math.PI * 2); ctx.fill();

// polyline helpers so particles can ride along wires
function polyLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return L; }
function polyPoint(pts, s) {
  for (let i = 1; i < pts.length; i++) {
    const seg = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    if (s <= seg) { const k = seg ? s / seg : 0; return { x: lerp(pts[i - 1].x, pts[i].x, k), y: lerp(pts[i - 1].y, pts[i].y, k) }; }
    s -= seg;
  }

}
function strokePoly(ctx, pts, color, w = 3) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); ctx.restore();
}
// seeded random so the same scene always starts the same way
function seeded(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

// =====================================================
//  Animation loop (the current scene may register a tick)
// =====================================================
let currentTick = null, lastTs = null;
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(ts) {
  if (lastTs == null) lastTs = ts;
  const dt = Math.min(50, ts - lastTs); lastTs = ts;
  if (currentTick) currentTick(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const scenes = [];

// ---- What you already know ----
scenes.push({

    }

    const top = [{ x: 318, y: 196 }, { x: 430, y: 196 }], top2 = [{ x: 610, y: 196 }, { x: 700, y: 196 }, { x: 700, y: 238 }];
    const loopPts = [{ x: 318, y: 196 }, { x: 700, y: 196 }, { x: 700, y: 238 }, { x: 740, y: 238 }, { x: 740, y: 292 }, { x: 250, y: 292 }, { x: 250, y: 242 }];

    function draw() {
      const b = st.b / 100, V = panelVolts(st.b), I = panelAmps(st.b);
      ctx.clearRect(0, 0, 860, 320);

      ctx.save(); ctx.strokeStyle = rgba(C.photon, 0.08 + 0.5 * b); ctx.lineWidth = 2; ctx.lineCap = 'round';

      ctx.restore();

      ctx.strokeStyle = 'rgba(148,163,184,0.35)'; ctx.lineWidth = 1;
      for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(80 + i * 39.6, 176); ctx.lineTo(80 + i * 39.6, 238); ctx.stroke(); }

});

// ---- Open the black box ----
const LAYERS = [
  { id: 'glass', name: 'Glass cover', h: 26, fill: '#e0f2fe', stroke: '#7dd3fc', job: 'protects the cell from weather and lets light through.' },
  { id: 'coat', name: 'Anti-reflective coating', h: 10, fill: '#1e3a8a', stroke: '#1e3a8a', job: 'a thin film that keeps light from bouncing off, so more of it gets in.' },
  { id: 'fingers', name: 'Metal fingers', h: 14, fill: '#f8fafc', stroke: '#94a3b8', job: 'thin metal lines that collect freed electrons and send them into the wire. They also cast a little shade.' },
  { id: 'n', name: 'n-type silicon', h: 30, fill: '#bfdbfe', stroke: '#60a5fa', job: 'a thin top layer of silicon with extra free electrons.' },
  { id: 'p', name: 'p-type silicon', h: 64, fill: '#fecdd3', stroke: '#fb7185', job: 'a thicker layer of silicon with extra empty spots called holes.' },
  { id: 'back', name: 'Back contact', h: 14, fill: '#94a3b8', stroke: '#64748b', job: 'a metal sheet on the bottom that brings electrons back to finish the circuit.' }
];
scenes.push({
  heading: 'Open the Black Box',
  seeLabel: 'Open the panel, then tap each layer',
  notes: "<strong>A solar cell is a stack of thin layers.</strong> Glass protects it. An anti-reflective coating keeps light from bouncing off. Metal fingers collect the electrons. The heart is two slices of silicon: <strong>n-type</strong> on top and <strong>p-type</strong> below. A back contact closes the circuit. The boundary where n meets p is called the <strong>junction</strong>.",
  notebook: "<strong>Before you open it</strong>, look at your sketch from Step 1. Then open the panel and tap every layer. <strong>Draw</strong> the six layers in order, top to bottom, and <strong>label</strong> each one's job. Circle anything your prediction got right.",
  build(stage) {
    const st = sceneState('layers', { open: false, seen: [], sel: null });
    requireTask('open', 'Open the panel');
    requireTask('layers', 'Tap all six layers');
    setTask('open', st.open); setTask('layers', st.seen.length === LAYERS.length);
    const { c, ctx } = makeCanvas(stage, 860, 330, 'A solar cell separated into its six layers');
    const openBtn = el('button', { class: 'primary', html: ICON.box + ' Open the panel' });
    const chips = LAYERS.map(L => el('button', { class: 'chip', 'aria-label': 'Show the ' + L.name }, L.name));
    const chipRow = el('div', { class: 'tool-row' }, chips);
    const status = el('p', { class: 'status-line', role: 'status', 'aria-live': 'polite' });
    stage.append(el('div', { class: 'tool-row' }, [openBtn]), chipRow, status);
    let k = st.open ? 1 : 0, opening = false, t = 0;
    const drops = [];
    function select(i) {
      if (!st.open) return;
      const L = LAYERS[i];
      st.sel = L.id;
      if (!st.seen.includes(L.id)) st.seen.push(L.id);
      if (st.seen.length === LAYERS.length) setTask('layers', true);
      sync(); persistWork();
    }
    function sync() {
      openBtn.hidden = st.open; chipRow.hidden = !st.open;
      chips.forEach((ch, i) => { ch.classList.toggle('active', st.sel === LAYERS[i].id); ch.classList.toggle('done', st.seen.includes(LAYERS[i].id)); });
      const L = LAYERS.find(x => x.id === st.sel);
      if (!st.open) status.textContent = 'Predict first, then open the panel.';
      else if (L) status.innerHTML = `<strong>${L.name}:</strong> ${L.job}` + (st.seen.length === LAYERS.length ? '' : ` <span class="mono">(${st.seen.length} of 6)</span>`);
      else status.textContent = 'Tap each layer to learn its job.';
    }
    chips.forEach((ch, i) => ch.addEventListener('click', () => select(i)));
    openBtn.addEventListener('click', () => { opening = true; openBtn.disabled = true; });
    function layout() {
      const gap = 16 * smooth(k), total = LAYERS.reduce((s, L) => s + L.h, 0) + gap * 5;
      let y = (330 - total) / 2 + 6;
      return LAYERS.map(L => { const r = { ...L, y }; y += L.h + gap; return r; });
    }
    c.addEventListener('pointerdown', e => {
      if (!st.open) return;
      const p = canvasPos(c, e);
      const i = layout().findIndex(L => p.y >= L.y - 8 && p.y <= L.y + L.h + 8 && p.x > 110);
      if (i >= 0) select(i);
    });
    const X0 = 130, X1 = 560;
    function draw() {
      ctx.clearRect(0, 0, 860, 330);
      const rows = layout();
      rows.forEach(L => {
        ctx.save();
        const on = st.sel === L.id;
        if (L.id === 'fingers') {
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X0, L.y + L.h - 2); ctx.lineTo(X1, L.y + L.h - 2); ctx.stroke();
          ctx.fillStyle = '#cbd5e1';
          for (let x = X0 + 16; x < X1 - 10; x += 44) { ctx.fillRect(x, L.y, 9, L.h); }
        } else {
          ctx.fillStyle = L.fill; ctx.fillRect(X0, L.y, X1 - X0, L.h);
          ctx.strokeStyle = L.stroke; ctx.lineWidth = 1; ctx.strokeRect(X0 + 0.5, L.y + 0.5, X1 - X0 - 1, L.h - 1);
          if (L.id === 'n') for (let i = 0; i < 9; i++) drawElectron(ctx, X0 + 30 + i * 47, L.y + L.h / 2, 4.5, 0.6 + 0.4 * k);
          if (L.id === 'p') for (let i = 0; i < 9; i++) drawHole(ctx, X0 + 30 + i * 47, L.y + L.h / 2 + (i % 2 ? 12 : -12), 5, 0.6 + 0.4 * k);
        }
        if (on) { ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 3; ctx.strokeRect(X0 - 4, L.y - 4, X1 - X0 + 8, L.h + 8); }
        ctx.restore();
      });
      // closed: the black box sits over the stack
      if (k < 1) {
        const a = 1 - smooth(k);
        const top = rows[0].y, bot = rows[rows.length - 1].y + rows[rows.length - 1].h;
        ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#1e293b'; roundRect(ctx, X0 - 8, top - 8, X1 - X0 + 16, bot - top + 16, 12); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '700 44px Roboto Serif, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', (X0 + X1) / 2, (top + bot) / 2);
        ctx.restore();
        drops.forEach(d => drawPhoton(ctx, d.x, d.y, 0, 1, 560, a));
      }
      if (k > 0.6) {
        const a = (k - 0.6) / 0.4;
        ctx.save(); ctx.globalAlpha = a;
        rows.forEach(L => {
          const done = st.seen.includes(L.id), on = st.sel === L.id;
          const col = on ? '#4f46e5' : done ? C.good : C.muted;
          drawLeader(ctx, X1 + 6, L.y + L.h / 2, 620, L.y + L.h / 2, col);
          drawPill(ctx, L.name, 622, L.y + L.h / 2, col, 13, 'left');
        });
        const n = rows[3], p = rows[4];
        const jy = (n.y + n.h + p.y) / 2;
        ctx.strokeStyle = rgba(C.field, 0.8); ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(X0 - 60, jy); ctx.lineTo(X0 - 6, jy); ctx.stroke(); ctx.setLineDash([]);
        drawPill(ctx, 'junction', X0 - 66, jy, C.field, 12, 'right');
        ctx.restore();
      }
    }
    currentTick = dt => {
      t += dt;
      if (opening) { k = REDUCED_MOTION ? 1 : Math.min(1, k + dt / 1200); if (k >= 1) { opening = false; st.open = true; finishTask('open'); sync(); persistWork(); } }
      if (!st.open && !REDUCED_MOTION) {
        if (Math.random() < 0.08) drops.push({ x: 150 + Math.random() * 390, y: 0 });
        drops.forEach(d => d.y += dt * 0.16);
        const top = layout()[0].y - 8;
        for (let i = drops.length - 1; i >= 0; i--) if (drops[i].y > top) drops.splice(i, 1);
      }
      draw();
    };
    sync(); draw();
  }
});

// ---- Light frees an electron (the photoelectric effect) ----
scenes.push({
  heading: 'Light Frees an Electron',
  seeLabel: 'Fire photons at silicon',
  notes: "<strong>A photon can knock one electron loose from silicon, but only if it carries at least 1.1 eV of energy.</strong> Silicon's outer electrons are locked in bonds between atoms. A freed electron can move, and it leaves behind a <strong>hole</strong>. Brighter light means more photons, not stronger ones. This is the <strong>photoelectric effect</strong>. In a solar cell the electron stays inside the silicon.",
  notebook: "<strong>Predict first:</strong> will ten weak infrared photons free an electron when one can't? Write yes or no and why. Then test it. <strong>Record</strong> the wavelength, the energy, and freed or not freed for three photons you fire. Use <strong>E = 1240 ÷ wavelength</strong>.",
  build(stage) {
    const st = sceneState('photon', { nm: 550, free: false, miss: false, ten: false });
    requireTask('free', 'Free an electron with one photon');
    requireTask('miss', 'Fire a photon with less than 1.1 eV');
    requireTask('ten', 'Fire ten photons with less than 1.1 eV at once');
    setTask('free', st.free); setTask('miss', st.miss); setTask('ten', st.ten);
    const scene = current;
    const { ctx } = makeCanvas(stage, 860, 330, 'Silicon atoms held together by bonds of shared outer electrons, with photons arriving');
    const range = el('input', { type: 'range', min: 400, max: 1400, step: 10, value: st.nm, 'aria-label': 'Photon wavelength in nanometers' });
    const val = el('span', { class: 'val' });
    const one = el('button', { class: 'primary', html: ICON.zap + ' Fire one photon' });
    const ten = el('button', {}, 'Fire ten photons');
    const reset = el('button', { html: ICON.reset + ' Reset the silicon' });
    const formula = el('p', { class: 'status-line' });
    const status = el('p', { class: 'status-line', role: 'status', 'aria-live': 'polite' });
    stage.append(el('div', { class: 'slider-row' }, [el('label', {}, 'Wavelength'), range, val]), formula, el('div', { class: 'tool-row' }, [one, ten, reset]), status);
    // lattice
    const atoms = [];
    for (let r = 0; r < 3; r++) for (let cc = 0; cc < 5; cc++) atoms.push({ x: 300 + 110 * cc, y: 80 + 90 * r });
    let bonds = [], free = [], photons = [], heat = [];
    function buildBonds() {
      bonds = [];
      for (let r = 0; r < 3; r++) for (let cc = 0; cc < 5; cc++) {
        const a = atoms[r * 5 + cc];
        if (cc < 4) { const b = atoms[r * 5 + cc + 1]; bonds.push({ x1: a.x, y1: a.y, x2: b.x, y2: b.y, mx: (a.x + b.x) / 2, my: a.y, h: true, hole: false }); }
        if (r < 2) { const b = atoms[(r + 1) * 5 + cc]; bonds.push({ x1: a.x, y1: a.y, x2: b.x, y2: b.y, mx: a.x, my: (a.y + b.y) / 2, h: false, hole: false }); }
      }
      free = []; photons = []; heat = [];
    }
    buildBonds();
    const dotPos = (b, i) => b.h ? { x: b.mx + (i ? 8 : -8), y: b.my } : { x: b.mx, y: b.my + (i ? 8 : -8) };
    function update() {
      const E = photonEV(st.nm);
      val.textContent = st.nm + ' nm, ' + bandName(st.nm);
      formula.innerHTML = `E = 1240 ÷ ${st.nm} = <span class="mono">${E.toFixed(2)} eV</span>` + (E >= BAND_GAP ? ' (enough to free an electron)' : ' (less than 1.1 eV)');
      persistWork();
    }
    range.addEventListener('input', () => { st.nm = +range.value; update(); });
    let batch = null;
    function fire(n) {
      const intact = bonds.filter(b => !b.hole && !b.targeted);
      if (intact.length < n) { buildBonds(); return fire(n); }
      for (let i = intact.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [intact[i], intact[j]] = [intact[j], intact[i]]; }
      batch = { n, left: n, nm: st.nm, freed: 0 };
      for (let i = 0; i < n; i++) {
        const b = intact[i]; b.targeted = true;
        const tx = dotPos(b, 0).x, ty = dotPos(b, 0).y;
        photons.push({ b, tx, ty, sx: tx - 150, sy: ty - 150, p: -i * 0.12, nm: st.nm, batch });
      }
      status.textContent = n === 1 ? 'Photon on its way...' : 'Ten photons on their way...';
    }
    one.addEventListener('click', () => fire(1));
    ten.addEventListener('click', () => fire(10));
    reset.addEventListener('click', () => { buildBonds(); status.textContent = 'The silicon is back to all bonds intact.'; });
    function land(ph) {
      const b = ph.b, E = photonEV(ph.nm), bt = ph.batch;
      b.targeted = false;
      if (E >= BAND_GAP) {
        b.hole = true; bt.freed++;
        const d = dotPos(b, 0), ang = Math.random() * Math.PI * 2;
        free.push({ x: d.x, y: d.y, vx: Math.cos(ang) * 60, vy: Math.sin(ang) * 60 });
        if (E - BAND_GAP >= 0.05) heat.push({ x: b.mx, y: b.my - 22, life: 1, text: '+' + (E - BAND_GAP).toFixed(2) + ' eV heat' });
      }
      bt.left--;
      if (bt.left === 0) finishBatch(bt);
    }
    function finishBatch(bt) {
      if (scene !== current) return;
      const E = photonEV(bt.nm);
      if (bt.n === 1) {
        if (bt.freed) { finishTask('free', scene); status.innerHTML = `One photon, one electron freed. It carried <span class="mono">${E.toFixed(2)} eV</span>, so <span class="mono">${(E - BAND_GAP).toFixed(2)} eV</span> became heat.`; }
        else { finishTask('miss', scene); status.innerHTML = `The <span class="mono">${E.toFixed(2)} eV</span> photon passed straight through. Nothing was freed.`; }
      } else {
        if (bt.freed) status.textContent = `Ten photons freed ${bt.freed} electrons. One photon frees one electron.`;
        else { finishTask('ten', scene); status.innerHTML = `Ten <span class="mono">${E.toFixed(2)} eV</span> photons, zero electrons freed. More photons do not make each one stronger.`; }
      }
    }
    function draw() {
      ctx.clearRect(0, 0, 860, 330);
      // energy bar
      const E = photonEV(st.nm), y0 = 300, scale = 240 / 3.2;
      ctx.save();
      ctx.fillStyle = '#f5f5f4'; roundRect(ctx, 62, y0 - 240, 34, 240, 8); ctx.fill();
      ctx.fillStyle = wlColor(st.nm, 0.85); roundRect(ctx, 62, y0 - E * scale, 34, E * scale, 8); ctx.fill();
      const ty = y0 - BAND_GAP * scale;
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(54, ty); ctx.lineTo(104, ty); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = C.ink; ctx.font = '600 12px Inter, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('silicon needs', 110, ty - 8); ctx.fillText('1.1 eV', 110, ty + 8);
      ctx.fillStyle = C.muted; ctx.font = '700 10px Roboto Mono, monospace'; ctx.textAlign = 'center';
      ctx.fillText('PHOTON', 79, 30); ctx.fillText('ENERGY', 79, 44);
      ctx.fillStyle = C.ink; ctx.font = '700 13px Roboto Mono, monospace'; ctx.fillText(E.toFixed(2) + ' eV', 79, 318);
      ctx.restore();
      // bonds + atoms
      bonds.forEach(b => {
        ctx.strokeStyle = '#e7e5e4'; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      });
      atoms.forEach(a => drawAtom(ctx, a.x, a.y, 'Si'));
      bonds.forEach(b => {
        const d0 = dotPos(b, 0), d1 = dotPos(b, 1);
        if (b.hole) drawHole(ctx, d0.x, d0.y, 6); else drawDot(ctx, d0.x, d0.y, C.valence);
        drawDot(ctx, d1.x, d1.y, C.valence);
      });
      free.forEach(f => drawElectron(ctx, f.x, f.y, 7));
      photons.forEach(ph => {
        if (ph.p < 0) return;
        const k = ph.p, x = lerp(ph.sx, ph.tx, k), y = lerp(ph.sy, ph.ty, k);
        drawPhoton(ctx, x, y, ph.tx - ph.sx, ph.ty - ph.sy, ph.nm, ph.p > 1 ? Math.max(0, 2 - ph.p) : 1);
      });
      heat.forEach(h => { ctx.save(); ctx.globalAlpha = Math.min(1, h.life * 1.5); drawPill(ctx, h.text, h.x, h.y, C.heat, 11); ctx.restore(); });
      ctx.save(); ctx.font = '600 12px Inter, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      drawDot(ctx, 262, 316, C.valence); ctx.fillStyle = C.muted; ctx.fillText('electron in a bond', 272, 316);
      drawElectron(ctx, 420, 316, 6); ctx.fillStyle = C.muted; ctx.fillText('free electron', 432, 316);
      drawHole(ctx, 546, 316, 6); ctx.fillStyle = C.muted; ctx.fillText('hole', 558, 316);
      ctx.restore();
    }
    currentTick = dt => {
      const s = dt / 1000;
      for (let i = photons.length - 1; i >= 0; i--) {
        const ph = photons[i], was = ph.p;
        ph.p += s * (REDUCED_MOTION ? 5 : 1.6);
        if (was < 1 && ph.p >= 1) {
          land(ph);
          if (frees(ph.nm)) { photons.splice(i, 1); continue; }
        }
        if (ph.p >= 2) photons.splice(i, 1);
      }
      free.forEach(f => {
        if (Math.random() < 0.03) { const a = Math.random() * Math.PI * 2; f.vx = Math.cos(a) * 60; f.vy = Math.sin(a) * 60; }
        f.x += f.vx * s; f.y += f.vy * s;
        if (f.x < 270 || f.x > 770) f.vx *= -1; if (f.y < 55 || f.y > 290) f.vy *= -1;
        f.x = clamp(f.x, 270, 770); f.y = clamp(f.y, 55, 290);
      });
      heat.forEach(h => { h.life -= s / 1.6; h.y -= s * 12; });
      heat = heat.filter(h => h.life > 0);
      draw();
    };
    update(); draw();
  }
});

// ---- Holes move too (empty seat analogy) ----
const PEOPLE = ['#fca5a5', '#fdba74', '#86efac', '#93c5fd', '#fcd34d', '#f9a8d4', '#67e8f9', '#d6d3d1'];
scenes.push({
  heading: 'Holes Move Too',
  seeLabel: 'Slide people into the empty seat',
  notes: "<strong>A hole is a missing electron, and it can move.</strong> When a neighbor electron hops into a hole, the hole jumps to where that electron was. Picture a full row with one empty seat: as each person slides over one seat, the empty seat travels the other way. Electrons drift one way, holes drift the other, and both carry current.",
  notebook: "<strong>Predict first:</strong> if people keep sliding right, which way will the empty seat travel? Then move it to the far left end. <strong>Draw</strong> the row before and after, with an arrow for the people and an arrow for the empty seat.",
  build(stage) {
    const st = sceneState('seats', { e: 7, order: [0, 1, 2, 3, 4, 5, 6, -1], moves: 0 });
    requireTask('far', 'Move the empty seat to the far left end');
    setTask('far', st.e === 0);
    const scene = current;
    const { c, ctx } = makeCanvas(stage, 860, 320, 'A row of eight seats with one empty seat, above a matching row of silicon bonds with one hole');
    const slide = el('button', { class: 'primary' }, 'Slide the next person over');
    const reset = el('button', { html: ICON.reset + ' Reset the row' });
    const status = el('p', { class: 'status-line', role: 'status', 'aria-live': 'polite' });
    stage.append(el('div', { class: 'tool-row' }, [slide, reset]), status);
    const X = i => 150 + 80 * i;
    let anim = null;
    function sync() {
      slide.disabled = st.e === 0 || !!anim;
      status.innerHTML = st.e === 0
        ? `The empty seat reached the far left after <span class="mono">${st.moves}</span> moves. Every person moved one seat to the right.`
        : st.moves === 0 ? 'Tap the person next to the empty seat, or use the button.'
        : `Empty seat is now seat <span class="mono">${st.e + 1}</span> of 8. People have slid right <span class="mono">${st.moves}</span> times.`;
    }
    function move(j) {
      if (anim || j < 0 || j > 7 || Math.abs(j - st.e) !== 1) return;
      anim = { from: j, to: st.e, who: st.order[j], k: 0 };
      sync();
    }
    slide.addEventListener('click', () => move(st.e - 1));
    reset.addEventListener('click', () => { if (anim) return; st.e = 7; st.order = [0, 1, 2, 3, 4, 5, 6, -1]; st.moves = 0; setTask('far', false); persistWork(); sync(); });
    c.addEventListener('pointerdown', e => {
      const p = canvasPos(c, e);
      const j = Math.round((p.x - 150) / 80);
      if (p.y > 40 && p.y < 290) move(j);
    });
    function person(x, y, col) {
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y - 30, 11, 0, Math.PI * 2); ctx.fill();
      roundRect(ctx, x - 15, y - 16, 30, 26, 9); ctx.fill();
    }
    function draw() {
      ctx.clearRect(0, 0, 860, 320);
      ctx.save(); ctx.fillStyle = C.muted; ctx.font = '700 11px Roboto Mono, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('A FULL ROW WITH ONE EMPTY SEAT', 110, 26); ctx.fillText('THE SAME IDEA IN SILICON', 110, 186); ctx.restore();
      const k = anim ? smooth(anim.k) : 0;
      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = '#e7e5e4'; roundRect(ctx, X(i) - 24, 110, 48, 16, 5); ctx.fill(); ctx.fillRect(X(i) - 24, 70, 8, 44);
        ctx.fillStyle = i === st.e && !anim ? rgba(C.hole, 0.08) : 'transparent';
      }
      // people
      st.order.forEach((who, i) => {
        if (who < 0) return;
        if (anim && i === anim.from) return;
        person(X(i), 108, PEOPLE[who]);
      });
      if (anim) person(lerp(X(anim.from), X(anim.to), k), 108, PEOPLE[anim.who]);
      const emptyAt = anim ? anim.from : st.e;
      if (!anim) { ctx.save(); ctx.strokeStyle = C.hole; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5; roundRect(ctx, X(emptyAt) - 28, 58, 56, 74, 8); ctx.stroke(); ctx.restore(); drawPill(ctx, 'empty seat', X(emptyAt), 150, C.hole, 11); }
      // silicon row
      ctx.strokeStyle = '#e7e5e4'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(110, 240); ctx.lineTo(750, 240); ctx.stroke();
      for (let i = 0; i < 9; i++) drawAtom(ctx, 110 + 80 * i, 240, 'Si', 15);
      st.order.forEach((who, i) => {
        if (who < 0 || (anim && i === anim.from)) return;
        drawElectron(ctx, X(i), 240, 7);
      });
      if (anim) drawElectron(ctx, lerp(X(anim.from), X(anim.to), k), 240, 7);
      if (!anim) drawHole(ctx, X(st.e), 240, 8);
      if (st.moves > 0) {
        const arrow = (x1, x2, y, col, text) => {
          ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
          const d = Math.sign(x2 - x1); ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(x2 - d * 10, y - 6); ctx.lineTo(x2 - d * 10, y + 6); ctx.closePath(); ctx.fill();
          ctx.font = '600 12px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, (x1 + x2) / 2, y - 12);
          ctx.restore();

    }
    currentTick = dt => {
      if (anim) {
        anim.k += REDUCED_MOTION ? 1 : dt / 320;
        if (anim.k >= 1) {
          st.order[anim.to] = anim.who; st.order[anim.from] = -1; st.e = anim.from; st.moves++;

// ---- Make n-type and p-type (doping) ----
scenes.push({
  heading: 'Make n-type and p-type',
  seeLabel: 'Swap in phosphorus or boron atoms',
  notes: "<strong>Engineers add a few other atoms to silicon. This is called doping.</strong> Silicon has 4 outer electrons. <strong>Phosphorus</strong> has 5, so it brings one extra free electron: <strong>n-type</strong>. <strong>Boron</strong> has 3, so it leaves a hole: <strong>p-type</strong>. Both slabs stay neutral, because every atom brings as many protons as electrons.",
  notebook: "<strong>Predict first:</strong> will n-type silicon have a negative charge overall? Write your guess. Then dope both slabs and read the net charge. <strong>Draw</strong> one phosphorus atom and one boron atom with their outer electrons, and circle the extra electron and the hole.",
  build(stage) {
    const st = sceneState('dope', { left: Array(12).fill('Si'), right: Array(12).fill('Si'), dop: 'P' });
    requireTask('n', 'Make the left slab n-type (2 or more phosphorus, no boron)');
    requireTask('p', 'Make the right slab p-type (2 or more boron, no phosphorus)');
    const { c, ctx } = makeCanvas(stage, 860, 330, 'Two slabs of silicon atoms that can be doped with phosphorus or boron');
    const chipP = el('button', { class: 'chip', 'aria-pressed': 'false' }, 'Phosphorus (5 outer electrons)');
    const chipB = el('button', { class: 'chip', 'aria-pressed': 'false' }, 'Boron (3 outer electrons)');
    const addL = el('button', {}, 'Add to left slab');
    const addR = el('button', {}, 'Add to right slab');
    const clear = el('button', { html: ICON.reset + ' Clear both' });
    const status = el('p', { class: 'status-line', role: 'status', 'aria-live': 'polite' });
    stage.append(el('div', { class: 'tool-row' }, [chipP, chipB]), el('div', { class: 'tool-row' }, [addL, addR, clear]), status);
    const pos = (side, i) => ({ x: (side === 'left' ? 110 : 500) + 90 * (i % 4), y: 100 + 80 * Math.floor(i / 4) });
    const count = (arr, k) => arr.filter(x => x === k).length;
    function evaluate() {
      const nOK = count(st.left, 'P') >= 2 && count(st.left, 'B') === 0;
      const pOK = count(st.right, 'B') >= 2 && count(st.right, 'P') === 0;
      setTask('n', nOK); setTask('p', pOK);
      chipP.classList.toggle('active', st.dop === 'P'); chipB.classList.toggle('active', st.dop === 'B');
      chipP.setAttribute('aria-pressed', String(st.dop === 'P')); chipB.setAttribute('aria-pressed', String(st.dop === 'B'));
      let msg;
      if (count(st.left, 'B')) msg = 'The left slab has boron. Boron adds holes, so it cannot make n-type.';
      else if (count(st.right, 'P')) msg = 'The right slab has phosphorus. Phosphorus adds free electrons, so it cannot make p-type.';
      else if (nOK && pOK) msg = 'Left slab is n-type and right slab is p-type. Both are still neutral.';
      else msg = 'Pick an atom, then tap silicon atoms in a slab to swap them.';
      status.textContent = msg;
      persistWork();
    }
    function toggle(side, i) {
      const arr = st[side];
      arr[i] = arr[i] === st.dop ? 'Si' : st.dop;
      evaluate();
    }
    chipP.addEventListener('click', () => { st.dop = 'P'; evaluate(); });
    chipB.addEventListener('click', () => { st.dop = 'B'; evaluate(); });
    const addNext = side => { const i = st[side].indexOf('Si'); if (i >= 0) toggle(side, [5, 2, 9, 0, 7, 10, 3, 4, 8, 1, 6, 11].find(j => st[side][j] === 'Si') ?? i); };
    addL.addEventListener('click', () => addNext('left'));
    addR.addEventListener('click', () => addNext('right'));
    clear.addEventListener('click', () => { st.left = Array(12).fill('Si'); st.right = Array(12).fill('Si'); evaluate(); });
    c.addEventListener('pointerdown', e => {
      const p = canvasPos(c, e);
      for (const side of ['left', 'right']) for (let i = 0; i < 12; i++) { const q = pos(side, i); if (Math.hypot(p.x - q.x, p.y - q.y) < 26) return toggle(side, i); }
    });
    let t = 0;
    function slabType(arr) { const P = count(arr, 'P'), B = count(arr, 'B'); return P && B ? 'mixed' : P ? 'n-type' : B ? 'p-type' : 'pure silicon'; }
    function draw() {
      ctx.clearRect(0, 0, 860, 330);
      ['left', 'right'].forEach(side => {
        const arr = st[side], type = slabType(arr), x0 = side === 'left' ? 70 : 460;
        ctx.save();
        ctx.fillStyle = type === 'n-type' ? rgba(C.electron, 0.07) : type === 'p-type' ? rgba(C.hole, 0.07) : '#fafaf9';
        ctx.strokeStyle = '#e7e5e4'; ctx.lineWidth = 1.5; roundRect(ctx, x0, 50, 350, 228, 14); ctx.fill(); ctx.stroke();
        ctx.restore();
        const col = type === 'n-type' ? C.electron : type === 'p-type' ? C.hole : C.muted;
        drawPill(ctx, (side === 'left' ? 'Left slab: ' : 'Right slab: ') + type, x0 + 175, 30, col, 12);
        // bonds
        ctx.strokeStyle = '#e7e5e4'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        for (let i = 0; i < 12; i++) { const a = pos(side, i); if (i % 4 < 3) { const b = pos(side, i + 1); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } if (i < 8) { const b = pos(side, i + 4); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } }
        arr.forEach((kind, i) => {
          const q = pos(side, i);
          drawAtom(ctx, q.x, q.y, kind, kind);
          const n = kind === 'B' ? 3 : 4;
          const angs = [-Math.PI / 4, Math.PI / 4, 3 * Math.PI / 4, -3 * Math.PI / 4];
          for (let d = 0; d < 4; d++) {
            const x = q.x + Math.cos(angs[d]) * 27, y = q.y + Math.sin(angs[d]) * 27;
            if (d < n) drawDot(ctx, x, y, C.valence, 3.5); else drawHole(ctx, x, y, 6);
          }
          if (kind === 'P') { const a = t / 600 + i; drawElectron(ctx, q.x + Math.cos(a) * 36, q.y + Math.sin(a) * 36, 6); }
        });
        const P = count(arr, 'P'), B = count(arr, 'B');
        ctx.save(); ctx.fillStyle = C.ink; ctx.font = '600 13px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(`free electrons ${P}  ·  holes ${B}  ·  net charge 0`, x0 + 175, 300);
        ctx.restore();
      });
      ctx.save(); ctx.font = '600 12px Inter, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      drawDot(ctx, 300, 322, C.valence, 3.5); ctx.fillStyle = C.muted; ctx.fillText('outer electron', 308, 322);
      drawElectron(ctx, 420, 322, 5); ctx.fillText('extra free electron', 430, 322);
      drawHole(ctx, 562, 322, 5); ctx.fillText('hole', 572, 322);
      ctx.restore();
    }
    currentTick = dt => { if (!REDUCED_MOTION) t += dt; draw(); };
    evaluate(); draw();
  }
});

// ---- Where the layers meet (the p-n junction) ----

  notebook: "<strong>Predict first:</strong> when the slabs touch, which way will the free electrons move? Then join them. <strong>Draw</strong> the junction with its plus and minus charges, and add an arrow showing which way the field pushes a free electron.",
  build(stage) {
    const st = sceneState('junction', { joined: false, hill: false });
    requireTask('join', 'Join the n-type and p-type slabs');
    requireTask('hill', 'Show the energy hill');
    setTask('join', st.joined); setTask('hill', st.hill);
    const scene = current;
    const { c, ctx } = makeCanvas(stage, 860, 360, 'An n-type slab and a p-type slab that form a junction when they touch');
    const joinBtn = el('button', { class: 'primary' }, 'Join the slabs');
    const hillBtn = el('button', { 'aria-pressed': String(st.hill) }, 'Show the energy hill');
    const status = el('p', { class: 'status-line', role: 'status', 'aria-live': 'polite' });
    stage.append(el('div', { class: 'tool-row' }, [joinBtn, hillBtn]), status);
    const SLAB_W = 300, PX = 430, JOIN_X = PX - SLAB_W, START_X = 50, Y0 = 44, H = 170;
    const rnd = seeded(7);
    let nX = st.joined ? JOIN_X : START_X, sliding = false, phase = st.joined ? 'done' : 'apart', dk = 0, t = 0;
    let electrons = Array.from({ length: 12 }, () => ({ rx: 20 + rnd() * 260, y: Y0 + 20 + rnd() * (H - 40) }));
    let holes = Array.from({ length: 12 }, () => ({ x: PX + 20 + rnd() * 260, y: Y0 + 20 + rnd() * (H - 40) }));
    const ionYs = [Y0 + 30, Y0 + 70, Y0 + 110, Y0 + 150];
    let movers = [];
    function settle() {
      electrons.sort((a, b) => b.rx - a.rx); holes.sort((a, b) => a.x - b.x);
      movers = ionYs.map((y, i) => ({ e: electrons[i], h: holes[i], ty: y, ex0: electrons[i].rx, ey0: electrons[i].y }));
      electrons = electrons.slice(4); holes = holes.slice(4);
      electrons.forEach(e => e.rx = Math.min(e.rx, 240)); holes.forEach(h => h.x = Math.max(h.x, PX + 50));
    }
    if (st.joined) { settle(); movers = []; }
    function sync() {
      joinBtn.disabled = phase !== 'apart';
      hillBtn.disabled = phase !== 'done';
      hillBtn.textContent = st.hill ? 'Hide the energy hill' : 'Show the energy hill';
      hillBtn.setAttribute('aria-pressed', String(st.hill));
      status.textContent = phase === 'apart' ? 'Drag the n-type slab until it touches the p-type slab.'
        : phase === 'crossing' ? 'Electrons near the border are crossing over to fill holes...'
        : st.hill ? 'On the hill, electrons roll down to the n side and holes float up to the p side.'
        : 'A junction formed: fixed plus charges on the n side, minus on the p side. Now show the energy hill.';
    }
    function touch() {
      phase = 'crossing'; dk = 0; nX = JOIN_X; settle(); sync();
    }
    joinBtn.addEventListener('click', () => { if (phase === 'apart') { sliding = true; joinBtn.disabled = true; } });
    hillBtn.addEventListener('click', () => { st.hill = !st.hill; if (st.hill) finishTask('hill', scene); persistWork(); sync(); });
    let drag = null;
    c.addEventListener('pointerdown', e => {
      if (phase !== 'apart') return;
      const p = canvasPos(c, e);
      if (p.x > nX && p.x < nX + SLAB_W && p.y > Y0 && p.y < Y0 + H) { drag = { dx: p.x - nX }; c.setPointerCapture(e.pointerId); }
    });
    c.addEventListener('pointermove', e => {
      const p = canvasPos(c, e);
      if (drag) { nX = clamp(p.x - drag.dx, START_X, JOIN_X); if (nX >= JOIN_X - 2) { drag = null; touch(); } }
      else c.style.cursor = phase === 'apart' && p.x > nX && p.x < nX + SLAB_W && p.y > Y0 && p.y < Y0 + H ? 'grab' : 'default';
    });
    const endDrag = () => { drag = null; };
    c.addEventListener('pointerup', endDrag); c.addEventListener('pointercancel', endDrag);
    const hillY = x => { const lo = 336, hi = 262; if (x < PX - 40) return lo; if (x > PX + 40) return hi; return lerp(lo, hi, smooth((x - (PX - 40)) / 80)); };
    function draw() {
      ctx.clearRect(0, 0, 860, 360);
      // slabs
      ctx.save();
      ctx.fillStyle = rgba(C.electron, 0.08); ctx.strokeStyle = rgba(C.electron, 0.4); ctx.lineWidth = 1.5; roundRect(ctx, nX, Y0, SLAB_W, H, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = rgba(C.hole, 0.08); ctx.strokeStyle = rgba(C.hole, 0.4); roundRect(ctx, PX, Y0, SLAB_W, H, 12); ctx.fill(); ctx.stroke();
      ctx.restore();
      drawPill(ctx, 'n-type', nX + SLAB_W / 2 - 60, 22, C.electron, 12);
      drawPill(ctx, 'p-type', PX + SLAB_W / 2 + 60, 22, C.hole, 12);
      if (phase !== 'apart') {
        const a = phase === 'done' ? 1 : dk;
        ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = rgba(C.field, 0.10); ctx.fillRect(PX - 42, Y0, 84, H); ctx.restore();
        ionYs.forEach(y => { ctx.save(); ctx.globalAlpha = a; drawIon(ctx, PX - 22, y, +1); drawIon(ctx, PX + 22, y, -1); ctx.restore(); });
        if (phase === 'done') {
          drawPill(ctx, 'junction', PX, 22, C.field, 12);
          // field arrows: point from + to -, and show the push on electrons
          ctx.save(); ctx.strokeStyle = C.field; ctx.fillStyle = C.field; ctx.lineWidth = 2;
          [Y0 + 50, Y0 + 130].forEach(y => { ctx.beginPath(); ctx.moveTo(PX - 8, y); ctx.lineTo(PX + 8, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(PX + 10, y); ctx.lineTo(PX + 3, y - 4); ctx.lineTo(PX + 3, y + 4); ctx.closePath(); ctx.fill(); });
          ctx.restore();
          drawPill(ctx, 'field pushes electrons back to the n side', PX, Y0 + H + 20, C.field, 12);
        }
      } else {
        drawPill(ctx, 'drag me', nX + SLAB_W / 2, Y0 + H / 2, C.electron, 12);
      }
      electrons.forEach((e, i) => drawElectron(ctx, nX + e.rx + Math.sin(t / 500 + i) * 4, e.y + Math.cos(t / 610 + i) * 4, 7));
      holes.forEach((h, i) => drawHole(ctx, h.x + Math.sin(t / 540 + i) * 4, h.y + Math.cos(t / 470 + i) * 4, 7));
      movers.forEach(m => {
        const k = smooth(clamp(dk * 1.3, 0, 1));
        const ex = lerp(nX + m.ex0, PX + 22, k), ey = lerp(m.ey0, m.ty, k);
        if (k < 1) { drawHole(ctx, lerp(m.h.x, PX + 22, k), lerp(m.h.y, m.ty, k), 7, 1 - k * 0.8); drawElectron(ctx, ex, ey, 7); }
      });
      if (st.hill && phase === 'done') {
        ctx.save();
        ctx.fillStyle = '#fafaf9'; ctx.beginPath(); ctx.moveTo(nX, 356);
        for (let x = nX; x <= PX + SLAB_W; x += 4) ctx.lineTo(x, hillY(x));
        ctx.lineTo(PX + SLAB_W, 356); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = C.field; ctx.lineWidth = 3; ctx.beginPath();
        for (let x = nX; x <= PX + SLAB_W; x += 4) x === nX ? ctx.moveTo(x, hillY(x)) : ctx.lineTo(x, hillY(x));
        ctx.stroke();
        ctx.fillStyle = C.muted; ctx.font = '700 10px Roboto Mono, monospace'; ctx.textAlign = 'left'; ctx.fillText('ELECTRON ENERGY HILL', nX + 4, 250);
        ctx.restore();
        const loopK = (t % 2800) / 2800;
        const bx = lerp(PX + 170, PX - 170, smooth(loopK));
        drawElectron(ctx, bx, hillY(bx) - 9, 8);
        const hx = lerp(PX - 170, PX + 170, smooth(loopK));
        drawHole(ctx, hx, hillY(hx) + 11, 8);
        drawPill(ctx, 'electrons roll down to n', nX + 90, 300, C.electron, 11);
        drawPill(ctx, 'holes float up to p', PX + 210, 300, C.hole, 11);
      }
    }
    currentTick = dt => {
      t += REDUCED_MOTION ? 0 : dt;
      if (sliding) { nX = Math.min(JOIN_X, nX + (REDUCED_MOTION ? 999 : dt * 0.25)); if (nX >= JOIN_X) { sliding = false; touch(); } }
      if (phase === 'crossing') {
        dk = Math.min(1, dk + (REDUCED_MOTION ? 1 : dt / 2200));
        if (dk >= 1) { phase = 'done'; movers = []; st.joined = true; finishTask('join', scene); persistWork(); sync(); }
      }
      draw();
    };
    sync(); draw();
  }
});

// ---- Power the fan ----
scenes.push({
  heading: 'Power the Fan',
  seeLabel: 'Click the silicon to free electron-hole pairs',
  notes: "<strong>The junction splits electron-hole pairs, and that split is the current.</strong> A pair freed near the junction gets pulled apart: the electron goes up to the metal fingers, the hole goes down. With the circuit closed, electrons flow through the wire, spin the fan, and return through the back contact to fill holes. Pairs freed too far away usually find each other again, and the energy becomes heat.",
  notebook: "<strong>Predict first:</strong> will a pair freed deep in the cell reach the fan? Test a near click and a far click, then close the switch and power the fan. <strong>Draw</strong> the full loop: photon, pair, junction push, fingers, wire, fan, back contact.",
  build(stage) {
    const st = sceneState('fan', { closed: false, delivered: 0, lost: 0, near: false, far: false });
    requireTask('near', 'Free a pair near the junction and watch it split');
    requireTask('far', 'Free a pair deep in the cell and watch what happens');
    requireTask('fan', 'Send 10 electrons through the fan');
    setTask('near', st.near); setTask('far', st.far); setTask('fan', st.delivered >= 10);
    const scene = current;
    const { c, ctx } = makeCanvas(stage, 860, 350, 'Cross-section of a solar cell wired to a fan through a switch');
    const nearBtn = el('button', { html: ICON.zap + ' Light near the junction' });
    const farBtn = el('button', { html: ICON.zap + ' Light deep in the cell' });
    const lampBtn = el('button', { 'aria-pressed': 'false', html: ICON.sun + ' Shine the lamp' });
    const switchBtn = el('button', { class: 'primary' });
    const status = el('p', { class: 'status-line', role: 'status', 'aria-live': 'polite' });
    stage.append(el('div', { class: 'tool-row' }, [nearBtn, farBtn, lampBtn, switchBtn]), status);
    const CX0 = 140, CX1 = 520, NY0 = 66, NY1 = 104, ZY1 = 134, PY1 = 300, BY1 = 314, REACH = 200;
    const FINGERS = [200, 330, 460];
    let photons = [], pairs = [], riders = [], pile = [], waiting = [], flashes = [], lamp = false, lampT = 0, fanAng = 0, fanVel = 0, t = 0;
    const wirePath = fx => [{ x: fx, y: 56 }, { x: 528, y: 56 }, { x: 700, y: 56 }, { x: 700, y: 330 }, { x: 330, y: 330 }, { x: 330, y: BY1 }];
    function sync() {
      switchBtn.textContent = st.closed ? 'Open the switch' : 'Close the switch';
      lampBtn.setAttribute('aria-pressed', String(lamp));
      lampBtn.innerHTML = ICON.sun + (lamp ? ' Turn off the lamp' : ' Shine the lamp');
      status.innerHTML = `Through the fan: <span class="mono">${Math.min(st.delivered, 999)}</span>` + (st.delivered < 10 ? ' of 10' : '') +
        ` · Lost as heat: <span class="mono">${st.lost}</span>` + (pile.length ? ` · Stuck at the open switch: <span class="mono">${pile.length}</span>` : '');
    }
    function shoot(x, y) {
      if (photons.length + pairs.length > 40) return;
      photons.push({ x, y, p: 0 });
    }
    nearBtn.addEventListener('click', () => shoot(160 + Math.random() * 340, NY1 + 14 + Math.random() * 30));
    farBtn.addEventListener('click', () => shoot(160 + Math.random() * 340, 250 + Math.random() * 40));
    lampBtn.addEventListener('click', () => { lamp = !lamp; sync(); });
    switchBtn.addEventListener('click', () => {
      st.closed = !st.closed;
      if (st.closed) { pile.forEach(e => riders.push({ path: wirePath(e.fx), s: 0 })); pile = []; }
      persistWork(); sync();
    });
    c.addEventListener('pointerdown', e => {
      const p = canvasPos(c, e);
      if (p.x > CX0 + 4 && p.x < CX1 - 4 && p.y > NY0 + 2 && p.y < PY1 - 2) shoot(p.x, p.y);
    });
    function makePair(x, y) {
      const collected = y <= REACH;
      pairs.push({ ex: x, ey: y, hx: x, hy: y, collected, age: 0, fx: FINGERS.reduce((b, f) => Math.abs(f - x) < Math.abs(b - x) ? f : b, FINGERS[0]) });
    }
    function draw() {
      ctx.clearRect(0, 0, 860, 350);
      // wire loop
      const loop = wirePath(528);
      strokePoly(ctx, loop.slice(1, 4), '#dc2626', 3.5);
      strokePoly(ctx, loop.slice(3), '#44403c', 3.5);
      // switch on the right wire
      ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(694, 244, 12, 42);
      ctx.strokeStyle = '#44403c'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(700, 286); ctx.lineTo(st.closed ? 700 : 724, st.closed ? 244 : 250); ctx.stroke();
      drawDot(ctx, 700, 244, '#44403c', 4); drawDot(ctx, 700, 286, '#44403c', 4);
      ctx.restore();
      drawPill(ctx, st.closed ? 'switch closed' : 'switch open', 770, 265, st.closed ? C.good : C.heat, 11);
      drawFan(ctx, 700, 150, 44, fanAng, fanVel > 0.3);
      drawPill(ctx, 'fan', 770, 150, C.muted, 12);
      // cell layers
      ctx.save();
      ctx.fillStyle = C.nTint; ctx.fillRect(CX0, NY0, CX1 - CX0, NY1 - NY0);
      ctx.fillStyle = rgba(C.field, 0.14); ctx.fillRect(CX0, NY1, CX1 - CX0, ZY1 - NY1);
      ctx.fillStyle = C.pTint; ctx.fillRect(CX0, ZY1, CX1 - CX0, PY1 - ZY1);
      ctx.fillStyle = C.metal; ctx.fillRect(CX0, PY1, CX1 - CX0, BY1 - PY1);
      ctx.fillStyle = '#cbd5e1'; ctx.fillRect(CX0 + 4, 52, CX1 - CX0, 5);
      FINGERS.forEach(f => ctx.fillRect(f - 5, 52, 10, 16));
      ctx.strokeStyle = '#d6d3d1'; ctx.lineWidth = 1; ctx.strokeRect(CX0 + 0.5, NY0 + 0.5, CX1 - CX0 - 1, BY1 - NY0 - 1);
      ctx.restore();
      for (let i = 0; i < 5; i++) { drawIon(ctx, CX0 + 40 + i * 78, NY1 + 8, +1); drawIon(ctx, CX0 + 40 + i * 78, ZY1 - 8, -1); }
      drawPill(ctx, 'n-type', 72, (NY0 + NY1) / 2, C.electron, 11);
      drawPill(ctx, 'junction', 72, (NY1 + ZY1) / 2 + 6, C.field, 11);
      drawPill(ctx, 'p-type', 72, 215, C.hole, 11);
      drawPill(ctx, 'back contact', 72, BY1 + 12, C.muted, 11);
      drawPill(ctx, 'metal fingers', 330, 30, C.muted, 11);
      // particles
      waiting.forEach(h => drawHole(ctx, h.x, h.y, 6));
      pairs.forEach(p => { drawHole(ctx, p.hx, p.hy, 6); drawElectron(ctx, p.ex, p.ey, 6); });
      pile.forEach((e, i) => drawElectron(ctx, e.x + Math.sin(t / 300 + i) * 2, e.y, 6));
      riders.forEach(r => { const q = polyPoint(r.path, r.s); drawElectron(ctx, q.x, q.y, 6); });
      photons.forEach(ph => drawPhoton(ctx, ph.x, lerp(0, ph.y, ph.p), 0, 1, 560));
      flashes.forEach(f => { ctx.save(); ctx.globalAlpha = f.life; ctx.fillStyle = rgba(C.heat, 0.25); ctx.beginPath(); ctx.arc(f.x, f.y, 18 * (1.4 - f.life), 0, Math.PI * 2); ctx.fill(); ctx.restore(); drawPill(ctx, 'heat', f.x, f.y - 22, C.heat, 10); });
    }
    currentTick = dt => {
      const s = dt / 1000; t += dt;
      if (lamp) { lampT += dt; while (lampT > 260) { lampT -= 260; shoot(150 + Math.random() * 360, NY0 + 6 + Math.random() * (PY1 - NY0 - 12)); } }
      for (let i = photons.length - 1; i >= 0; i--) { const ph = photons[i]; ph.p += s * (REDUCED_MOTION ? 10 : 3.2); if (ph.p >= 1) { photons.splice(i, 1); makePair(ph.x, ph.y); } }
      for (let i = pairs.length - 1; i >= 0; i--) {
        const p = pairs[i]; p.age += s;
        if (p.collected) {
          p.ey = Math.max(NY0 + 4, p.ey - s * 190);
          p.hy = Math.min(PY1 - 8, p.hy + s * 150);
          if (p.ey <= NY0 + 4 && p.hy >= PY1 - 8) {
            pairs.splice(i, 1);
            if (!st.near) { st.near = true; finishTask('near', scene); }
            waiting.push({ x: p.hx, y: PY1 - 8 });
            if (st.closed) riders.push({ path: [{ x: p.ex, y: NY0 + 4 }, ...wirePath(p.fx)], s: 0 });
            else pile.push({ x: p.ex, y: NY0 + 10, fx: p.fx });
            sync(); persistWork();
          }
        } else {
          const k = clamp(p.age / 1.4, 0, 1);
          p.ex += Math.sin(p.age * 9 + i) * 1.4; p.ey += Math.cos(p.age * 7 + i) * 1.2;
          p.hx = lerp(p.hx, p.ex, 0.04 + 0.1 * k); p.hy = lerp(p.hy, p.ey, 0.04 + 0.1 * k);
          if (p.age > 1.5) {
            pairs.splice(i, 1); flashes.push({ x: p.ex, y: p.ey, life: 1 });
            st.lost++; if (!st.far) { st.far = true; finishTask('far', scene); }
            sync(); persistWork();
          }
        }
      }
      for (let i = riders.length - 1; i >= 0; i--) {
        const r = riders[i]; r.s += s * (REDUCED_MOTION ? 2000 : 300);
        if (r.s >= polyLen(r.path)) {
          riders.splice(i, 1);
          if (waiting.length) { const h = waiting.shift(); flashes.push({ x: h.x, y: h.y, life: 0.01 }); }
          st.delivered++; fanVel = Math.min(14, fanVel + 2.2);
          if (st.delivered >= 10) finishTask('fan', scene);
          sync(); persistWork();
        }
      }
      if (!st.closed && riders.length) { /* electrons already in the wire finish their trip */ }
      fanVel *= Math.exp(-dt / 1100); if (!REDUCED_MOTION) fanAng += fanVel * s;
      flashes.forEach(f => f.life -= s / 1.1); flashes = flashes.filter(f => f.life > 0);
      draw();
    };
    sync(); draw();
  }
});

// ---- Design lab (shared by the fair test and the challenge) ----
function labShared() { return WORK.lab ||= { surface: 'none', spacing: 4, thick: 300 }; }
function buildLab(stage, mode) {
  const d = labShared();
  const st = sceneState('trials', { rows: [] });
  const scene = current;
  if (mode === 'fair') requireTask('fair', 'Run 3 trials that change only one variable');
  else requireTask('best', 'Build a cell with ' + TARGET_EFF + '% efficiency or higher');
  const { ctx } = makeCanvas(stage, 860, 300, 'Cross-section of a test solar cell and where the sunlight energy goes');
  const rowOf = (label, items, key, fmt) => {
    const chips = items.map(v => el('button', { class: 'chip', 'aria-pressed': 'false' }, fmt(v)));
    chips.forEach((ch, i) => ch.addEventListener('click', () => { d[key] = key === 'surface' ? items[i].id : items[i]; syncChips(); draw(); persistWork(); }));
    return { row: el('div', { class: 'tool-row' }, [el('span', { class: 'row-label' }, label), ...chips]), chips, items, key };
  };
  const rows = [
    rowOf('Surface', SURFACES, 'surface', v => v.name),
    rowOf('Finger spacing', SPACINGS, 'spacing', v => v + ' mm'),
    rowOf('Silicon thickness', THICKNESSES, 'thick', v => v + ' µm')
  ];
  const run = el('button', { class: 'primary', html: ICON.play + ' Run test' });
  const clear = el('button', { html: ICON.reset + ' Clear trials' });
  const status = el('p', { class: 'status-line', role: 'status', 'aria-live': 'polite' });
  const log = el('div', { class: 'run-log' });
  stage.append(...rows.map(r => r.row), el('div', { class: 'tool-row' }, [run, clear]), status, log);
  function syncChips() {
    rows.forEach(r => r.chips.forEach((ch, i) => { const v = r.key === 'surface' ? r.items[i].id : r.items[i]; const on = d[r.key] === v; ch.classList.toggle('active', on); ch.setAttribute('aria-pressed', String(on)); }));
  }
  const lastRun = () => st.rows[st.rows.length - 1];
  const measured = () => { const r = lastRun(); return r && designKey(r) === designKey(d) ? r : null; };
  function paintLog() {
    log.innerHTML = '';
    log.append(el('div', { class: 'row head' }, ['#', 'Surface', 'Fingers', 'Thickness', 'Efficiency'].map(x => el('span', {}, x))));
    if (!st.rows.length) { log.append(el('div', { class: 'empty' }, 'Your trials appear here.')); return; }
    const best = Math.max(...st.rows.map(r => r.eff));
    st.rows.slice(-8).forEach((r, j) => {
      const i = st.rows.length - Math.min(8, st.rows.length) + j;
      log.append(el('div', { class: 'row' + (r.eff === best ? ' best' : '') }, [
        el('span', { class: 'n' }, String(i + 1)), el('span', {}, SURFACES.find(s => s.id === r.surface).name),
        el('span', {}, r.spacing + ' mm'), el('span', {}, r.thick + ' µm'), el('span', { class: 'n' }, r.eff.toFixed(1) + '%')
      ]));
    });
  }
  function evaluate() {
    if (mode === 'fair') {
      const f = fairTest(st.rows);
      setTask('fair', !!f, scene);
      status.className = 'status-line' + (f ? ' complete' : '');
      status.textContent = f ? `Fair test: ${f.count} trials that change only ${f.name}.` : st.rows.length ? `Trials so far: ${st.rows.length}. Keep two settings the same and change just one.` : 'Pick one variable to test, then run a trial.';
    } else {
      const best = st.rows.length ? Math.max(...st.rows.map(r => r.eff)) : 0;
      const hit = best >= TARGET_EFF;
      setTask('best', hit, scene);
      status.className = 'status-line' + (hit ? ' complete' : '');
      status.textContent = !st.rows.length ? 'Predict the best design, then run it.' : hit ? `Challenge met: your best cell reaches ${best.toFixed(1)}%.` : `Best so far: ${best.toFixed(1)}%. The goal is ${TARGET_EFF}% or higher.`;
    }
  }
  run.addEventListener('click', () => {
    st.rows.push({ surface: d.surface, spacing: d.spacing, thick: d.thick, eff: +effText(d) });
    if (st.rows.length > 40) st.rows.shift();
    paintLog(); evaluate(); draw(); persistWork();
  });
  clear.addEventListener('click', () => { st.rows = []; paintLog(); evaluate(); draw(); persistWork(); });
  const LOSS_ROWS = [
    ['reflect', 'Reflected off the surface', '#f59e0b'],
    ['shade', 'Shaded by the metal fingers', '#94a3b8'],
    ['pass', 'Passed through the silicon', '#fbbf24'],
    ['mismatch', 'Wrong photon energy for silicon', '#fca5a5'],
    ['recomb', 'Pairs recombined before the junction', '#dc2626'],
    ['resist', 'Lost in the thin top layer', '#a8a29e'],
    ['out', 'Electricity out', '#10b981']
  ];
  function draw() {
    ctx.clearRect(0, 0, 860, 300);
    const s = SURFACES.find(x => x.id === d.surface);
    const X0 = 40, X1 = 420, top = 92, nH = 14, pH = 18 + d.thick * 0.5, bH = 8;
