<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>How Solar Panels Work</title>
<style>
  :root {
    --bg-0: #0a0a0a;
    --bg-1: #141414;
    --ink-hi: #f5f5f5;
    --ink-mid: #a0a0a0;
    --ink-low: #6b7280;
    --sun: #ffd166;
    --electron: #5cc9ff;
    --hole: #ff7a6b;
    --water: #5eead4;
    --ok: #4ade80;
    --accent: #6366f1;
    --panel: #141414;
    --panel-border: rgba(255,255,255,0.10);
    --note-bg: #fdf1c6;
    --note-ink: #2a1e08;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg-0);
    color: var(--ink-hi);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  header {
    padding: 14px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    max-width: 1200px;
    margin: 0 auto;
  }
  header .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-low);
  }
  .step-indicator {
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink-low);
    letter-spacing: 1px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px 20px;
  }
  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  canvas { display: block; width: 100%; height: auto; }
  .phase-bar {
    padding: 16px 28px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: center;
    border-top: 1px solid var(--panel-border);
    background: rgba(5, 8, 20, 0.4);
  }
  .phase-name {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.1px;
    color: var(--accent);
    transition: color 400ms ease;
  }
  .sim-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 250ms ease;
  }
  .sim-controls.visible { opacity: 1; pointer-events: auto; }
  .sim-controls .sim-readout {
    font-size: 14px;
    color: var(--ink-mid);
    letter-spacing: 0.2px;
    min-width: 210px;
    text-align: right;
  }
  .sim-controls .sim-readout strong {
    color: var(--sun);
    font-variant-numeric: tabular-nums;
    font-size: 16px;
  }
  .sim-controls button.sim-btn {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255, 209, 102, 0.35);
    background: rgba(255, 209, 102, 0.08);
    color: #ffe08a;
    cursor: pointer;
    transition: background 150ms, border-color 150ms;
    white-space: nowrap;
  }
  .sim-controls button.sim-btn:hover { background: rgba(255, 209, 102, 0.18); border-color: rgba(255, 209, 102, 0.6); }
  .sim-controls button.sim-btn.alt {
    border-color: rgba(94, 234, 212, 0.35);
    background: rgba(94, 234, 212, 0.08);
    color: #99f6e4;
  }
  .sim-controls button.sim-btn.alt:hover { background: rgba(94, 234, 212, 0.18); border-color: rgba(94, 234, 212, 0.6); }
  .sim-controls button.sim-btn.hidden { display: none; }
  .content { margin-top: 14px; }
  .notes-card {
    background: var(--note-bg);
    color: var(--note-ink);
    padding: 16px 22px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.55;
    position: relative;
    box-shadow:
      0 14px 40px rgba(255, 209, 102, 0.08),
      inset 0 0 0 1px rgba(0,0,0,0.02);
  }
  .step-heading {
    font-weight: 700;
    font-size: 16px;
    color: #7a3a00;
    margin-bottom: 4px;
    letter-spacing: 0.2px;
  }
  .notes-card p { margin: 0 0 6px; }
  .notes-card strong { font-weight: 700; color: #2a1e08; }

  .notebook-prompt {
    margin-top: 10px;
    padding: 12px 16px;
    background: linear-gradient(90deg, rgba(255, 209, 102, 0.15), rgba(244, 114, 182, 0.12));
    border: 1.5px solid rgba(255, 209, 102, 0.45);
    border-left: 5px solid #ffd166;
    border-radius: 10px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    line-height: 1.5;
    color: #f3d589;
  }
  .notebook-prompt .np-tag {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 4px 9px;
    background: #ffd166;
    color: #2a1e08;
    border-radius: 5px;
    margin-top: 1px;
  }
  .notebook-prompt strong { color: #ffd166; font-weight: 700; }

  nav {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--ink-hi);
    cursor: pointer;
    transition: background 150ms, transform 50ms, border-color 150ms;
  }
  button:hover:not(:disabled) {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.15);
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
    color: #f5f5ff;
    border-color: rgba(99, 102, 241, 0.55);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.25);
  }
  button.primary:hover { filter: brightness(1.08); }
  .btn-group { display: flex; gap: 10px; }
  @media (max-width: 720px) {
    .phase-bar { grid-template-columns: 1fr; }
    .sim-controls { justify-content: space-between; flex-wrap: wrap; }
    .phase-name { font-size: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="title">How Solar Panels Work</div>
  <div class="step-indicator" id="stepIndicator">01 / 10</div>
</header>

<main>
  <div class="stage">
    <canvas id="canvas" width="1600" height="650"></canvas>
    <div class="phase-bar">
      <div class="phase-name" id="phaseName">Step 1</div>
      <div class="sim-controls" id="simControls">
        <button class="sim-btn alt" id="ctrlA">Action A</button>
        <button class="sim-btn" id="ctrlB">Action B</button>
        <div class="sim-readout" id="simReadout"></div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="notes-card">
      <div class="step-heading" id="stepHeading">Step 1</div>
      <p id="notes"></p>
    </div>
    <div class="notebook-prompt" id="notebookPrompt">
      <div class="np-tag">✎ NOTES</div>
      <div id="notebookText"></div>
    </div>
  </div>

  <nav>
    <button id="resetBtn">Start Over</button>
    <div class="btn-group">
      <button id="prevBtn">← Back</button>
      <button id="nextBtn" class="primary">Next →</button>
    </div>
  </nav>
</main>

<script>
// =====================================================
//  Canvas setup
// =====================================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width;   // 1600
const H = canvas.height;  // 650
const MID = H / 2;

let currentSceneIdx = 0;
let animT = 0;
let sceneFadeT = 0;
let sceneLocal = {};
function clearField() { sceneLocal = {}; }

// Draggable sun (shared across scenes that use it)
let sun = { x: 760, y: 130 };
let dragging = false;

// Colors
const C_SUN = '#ffd166';
const C_SUN2 = '#ffb703';
const C_PHOTON = '#ffe08a';
const C_ELECTRON = '#5cc9ff';
const C_ELECTRON_GLOW = 'rgba(92, 201, 255,';
const C_HOLE = '#ff7a6b';
const C_HOLE_GLOW = 'rgba(255, 122, 107,';
const C_WATER = '#5eead4';
const C_WIRE = '#e0a070';
const C_ACCENT = '#6366f1';
const C_OK = '#4ade80';

// =====================================================
//  Helpers
// =====================================================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function smooth(t) { return t * t * (3 - 2 * t); }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Glassmorphic label with tapered leader (matches synapse drawLabel)
function drawLabel(ctx, lx, ly, dotX, dotY, text, color, align) {
  ctx.save();
  align = align || 'left';
  // tapered leader
  const grad = ctx.createLinearGradient(lx, ly, dotX, dotY);
  grad.addColorStop(0, `rgba(${color},0.85)`);
  grad.addColorStop(1, `rgba(${color},0.25)`);
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(dotX, dotY); ctx.stroke();
  // dot glow + pulse ring
  const pulse = (Math.sin(animT / 600 + dotY * 0.03) + 1) * 0.5;
  const dg = ctx.createRadialGradient(dotX, dotY, 0, dotX, dotY, 12);
  dg.addColorStop(0, `rgba(${color},0.5)`);
  dg.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(dotX, dotY, 12, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(${color},${0.25 + pulse * 0.3})`;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(dotX, dotY, 5 + pulse * 2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = `rgb(${color})`;
  ctx.beginPath(); ctx.arc(dotX, dotY, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(dotX - 1, dotY - 1, 1.3, 0, Math.PI * 2); ctx.fill();
  // pill
  ctx.font = '600 14px system-ui, -apple-system';
  const tw = ctx.measureText(text).width;
  const padX = 11, padY = 7, h = 28;
  const w = tw + padX * 2;
  const bx = align === 'right' ? lx - w : lx;
  const by = ly - h / 2;
  ctx.shadowColor = `rgba(${color},0.35)`;
  ctx.shadowBlur = 18; ctx.shadowOffsetY = 3;
  const bg = ctx.createLinearGradient(bx, by, bx, by + h);
  bg.addColorStop(0, 'rgba(28,32,48,0.94)');
  bg.addColorStop(1, 'rgba(14,18,30,0.94)');
  ctx.fillStyle = bg;
  roundRect(ctx, bx, by, w, h, 8); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = `rgba(${color},0.55)`;
  ctx.lineWidth = 1; roundRect(ctx, bx, by, w, h, 8); ctx.stroke();
  // top gloss
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.moveTo(bx + 6, by + 1); ctx.lineTo(bx + w - 6, by + 1); ctx.stroke();
  ctx.fillStyle = `rgb(${color})`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + padX, ly + 0.5);
  ctx.restore();
}

// --- Sun ---
function drawSun(ctx, x, y, r, intensity, grabbable) {
  ctx.save();
  // outer glow scales with intensity
  const glowR = r * (3.2 + intensity * 1.4);
  const g = ctx.createRadialGradient(x, y, 0, x, y, glowR);
  g.addColorStop(0, `rgba(255, 209, 102, ${0.45 + intensity * 0.25})`);
  g.addColorStop(0.4, 'rgba(255, 183, 3, 0.12)');
  g.addColorStop(1, 'rgba(255, 183, 3, 0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, glowR, 0, Math.PI * 2); ctx.fill();
  // rays
  const nRays = 12;
  ctx.strokeStyle = `rgba(255, 209, 102, ${0.5 + intensity * 0.4})`;
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < nRays; i++) {
    const a = (i / nRays) * Math.PI * 2 + animT / 4000;
    const r1 = r * 1.35, r2 = r * (1.75 + 0.25 * Math.sin(animT / 500 + i));
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
    ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2);
    ctx.stroke();
  }
  // body
  const bg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  bg.addColorStop(0, '#fff4cf');
  bg.addColorStop(0.6, C_SUN);
  bg.addColorStop(1, C_SUN2);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  if (grabbable) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r + 9, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '600 12px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('drag me', x, y + r + 26);
  }
  ctx.restore();
}

// light beam from sun to a target rectangle
function drawBeam(ctx, sx, sy, tx, ty, halfW, intensity) {
  if (intensity <= 0.02) return;
  ctx.save();
  const ang = Math.atan2(ty - sy, tx - sx);
  const perp = ang + Math.PI / 2;
  const ox = Math.cos(perp) * halfW, oy = Math.sin(perp) * halfW;
  const grad = ctx.createLinearGradient(sx, sy, tx, ty);
  grad.addColorStop(0, `rgba(255, 224, 138, ${0.32 * intensity})`);
  grad.addColorStop(1, `rgba(255, 224, 138, ${0.05 * intensity})`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(sx - ox * 0.2, sy - oy * 0.2);
  ctx.lineTo(sx + ox * 0.2, sy + oy * 0.2);
  ctx.lineTo(tx + ox, ty + oy);
  ctx.lineTo(tx - ox, ty - oy);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// --- Solar panel drawn as a tilted parallelogram (iso look) ---
// cx,cy = center of panel face; skew = horizontal lean; glow = intensity sheen
function drawPanel(ctx, cx, cy, w, h, skew, intensity, cols, rows) {
  ctx.save();
  cols = cols || 6; rows = rows || 4;
  const hw = w / 2, hh = h / 2;
  // corners (top edge pushed by skew for a tilt feel)
  const tl = { x: cx - hw + skew, y: cy - hh };
  const tr = { x: cx + hw + skew, y: cy - hh };
  const br = { x: cx + hw, y: cy + hh };
  const bl = { x: cx - hw, y: cy + hh };
  function lerpPt(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) }; }
  // frame shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 16;
  ctx.fillStyle = '#0c1830';
  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // base
  const base = ctx.createLinearGradient(tl.x, tl.y, bl.x, bl.y);
  base.addColorStop(0, '#15326a');
  base.addColorStop(1, '#0b1c44');
  ctx.fillStyle = base;
  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
  ctx.closePath(); ctx.fill();
  // cells grid
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const a = lerpPt(lerpPt(tl, tr, c / cols), lerpPt(bl, br, c / cols), r / rows);
      const b = lerpPt(lerpPt(tl, tr, (c + 1) / cols), lerpPt(bl, br, (c + 1) / cols), r / rows);
      const d = lerpPt(lerpPt(tl, tr, c / cols), lerpPt(bl, br, c / cols), (r + 1) / rows);
      const e = lerpPt(lerpPt(tl, tr, (c + 1) / cols), lerpPt(bl, br, (c + 1) / cols), (r + 1) / rows);
      const cell = ctx.createLinearGradient(a.x, a.y, e.x, e.y);
      const lit = 0.12 + intensity * 0.35;
      cell.addColorStop(0, `rgba(56, 116, 220, ${0.55 + lit})`);
      cell.addColorStop(1, `rgba(20, 50, 120, 0.9)`);
      ctx.fillStyle = cell;
      ctx.beginPath();
      ctx.moveTo(a.x + 2, a.y + 2); ctx.lineTo(b.x - 2, b.y + 2);
      ctx.lineTo(e.x - 2, e.y - 2); ctx.lineTo(d.x + 2, d.y - 2);
      ctx.closePath(); ctx.fill();
    }
  }
  // sheen sweep (intensity)
  if (intensity > 0.05) {
    const sg = ctx.createLinearGradient(tl.x, tl.y, br.x, br.y);
    sg.addColorStop(0, `rgba(255,255,255,${0.04 + intensity * 0.16})`);
    sg.addColorStop(0.5, 'rgba(255,255,255,0.0)');
    sg.addColorStop(1, `rgba(255,255,255,${intensity * 0.06})`);
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
    ctx.closePath(); ctx.fill();
  }
  // frame edge
  ctx.strokeStyle = '#9fb3d8'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
  ctx.closePath(); ctx.stroke();
  ctx.restore();
  return { tl, tr, br, bl, out: { x: br.x, y: br.y } };
}

// --- Motor with spinning blades ---
function drawMotor(ctx, x, y, r, angle, intensity) {
  ctx.save();
  // housing
  const hg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r * 1.3);
  hg.addColorStop(0, '#3a3f4a'); hg.addColorStop(1, '#15181f');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(x, y, r * 1.25, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r * 1.25, 0, Math.PI * 2); ctx.stroke();
  // blades
  ctx.translate(x, y); ctx.rotate(angle);
  const spin = intensity > 0.05;
  for (let i = 0; i < 3; i++) {
    ctx.rotate((Math.PI * 2) / 3);
    const bg = ctx.createLinearGradient(0, 0, 0, -r);
    bg.addColorStop(0, spin ? '#7dd3fc' : '#5b6675');
    bg.addColorStop(1, spin ? '#3b82f6' : '#3a414c');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(r * 0.5, -r * 0.55, r * 0.18, -r);
    ctx.quadraticCurveTo(0, -r * 0.85, -r * 0.18, -r);
    ctx.quadraticCurveTo(-r * 0.5, -r * 0.55, 0, 0);
    ctx.closePath(); ctx.fill();
  }
  // hub
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // motion blur arc when spinning fast
  if (intensity > 0.4) {
    ctx.save();
    ctx.strokeStyle = `rgba(125, 211, 252, ${(intensity - 0.4) * 0.5})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r * 1.05, angle, angle + Math.PI * 1.2); ctx.stroke();
    ctx.restore();
  }
}

// --- copper wire path ---
function drawWire(ctx, pts, flow, color) {
  ctx.save();
  ctx.strokeStyle = color || C_WIRE;
  ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,235,210,0.3)'; ctx.lineWidth = 1.5;
  ctx.stroke();
  // electron flow dots
  if (flow > 0.02) {
    let total = 0; const segs = [];
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      segs.push(d); total += d;
    }
    const n = Math.max(3, Math.round(total / 60));
    for (let k = 0; k < n; k++) {
      let d = ((k / n) + (animT / 1400) * flow) % 1 * total;
      let i = 0;
      while (i < segs.length && d > segs[i]) { d -= segs[i]; i++; }
      if (i >= segs.length) i = segs.length - 1;
      const f = segs[i] ? d / segs[i] : 0;
      const px = lerp(pts[i].x, pts[i + 1].x, f);
      const py = lerp(pts[i].y, pts[i + 1].y, f);
      ctx.fillStyle = C_ELECTRON;
      ctx.shadowColor = C_ELECTRON; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(px, py, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

// --- horizontal meter bar ---
function drawMeter(ctx, x, y, w, label, frac, valueText, color, pinned) {
  ctx.save();
  ctx.font = '600 15px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(245,245,245,0.85)';
  ctx.fillText(label, x, y - 16);
  // track
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  roundRect(ctx, x, y, w, 16, 8); ctx.fill();
  // fill
  const fw = clamp(frac, 0, 1) * w;
  const g = ctx.createLinearGradient(x, y, x + w, y);
  g.addColorStop(0, color); g.addColorStop(1, color);
  ctx.fillStyle = g;
  if (fw > 4) { roundRect(ctx, x, y, fw, 16, 8); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  roundRect(ctx, x, y, w, 16, 8); ctx.stroke();
  // value
  ctx.fillStyle = color; ctx.font = '700 16px system-ui';
  ctx.textAlign = 'right';
  ctx.fillText(valueText, x + w, y - 16);
  if (pinned) {
    ctx.fillStyle = 'rgba(160,160,160,0.8)'; ctx.font = '600 11px system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('stays nearly constant', x, y + 30);
  }
  ctx.restore();
}

// intensity from sun position relative to an ideal overhead point
function overheadIntensity(idealX, idealY, rangeX, rangeY) {
  const dx = (sun.x - idealX) / rangeX;
  const dy = (sun.y - idealY) / rangeY;
  return clamp(1 - Math.sqrt(dx * dx + dy * dy), 0, 1);
}

    ctx.save();
    ctx.textAlign = 'left';
    ctx.fillStyle = C_SUN; ctx.font = '800 30px system-ui';
    ctx.fillText('Now build it for real.', 820, 330);
    ctx.fillStyle = 'rgba(245,245,245,0.92)'; ctx.font = '500 19px system-ui';
    const lines = [
      'Get copper foil, salt water, and a',
      'multimeter from Eric.',
      '',
      'Build your own photocell and measure',
      'its voltage in sun and in shade.',
      '',
      'Same physics. Real data. Your hands.'
    ];
    lines.forEach((ln, i) => ctx.fillText(ln, 820, 376 + i * 30));
    ctx.restore();
  }
};

// =====================================================
//  Scenes list
// =====================================================
const scenes = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9, scene10];

// =====================================================
//  UI
// =====================================================
const phaseNameEl = document.getElementById("phaseName");
const notesEl = document.getElementById("notes");
const stepHeadingEl = document.getElementById("stepHeading");
const notebookTextEl = document.getElementById("notebookText");
const stepIndicator = document.getElementById("stepIndicator");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const resetBtn = document.getElementById("resetBtn");
const simControlsEl = document.getElementById("simControls");
const ctrlA = document.getElementById("ctrlA");
const ctrlB = document.getElementById("ctrlB");
const simReadout = document.getElementById("simReadout");

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function setScene(i) {
  currentSceneIdx = i;
  animT = 0;
  sceneFadeT = 0;
  const s = scenes[i];
  if (s.setup) s.setup();
  phaseNameEl.textContent = s.phase;
  phaseNameEl.style.color = s.phaseColor;
  notesEl.innerHTML = s.notes;
  stepHeadingEl.textContent = s.phase;
  notebookTextEl.innerHTML = s.notebook;
  stepIndicator.textContent = `${pad2(i + 1)} / ${pad2(scenes.length)}`;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === scenes.length - 1;
  nextBtn.textContent = i === scenes.length - 1 ? 'Done' : 'Next →';
  // controls
  if (s.isInteractive) {
    simControlsEl.classList.add('visible');
    const c = s.controls;
    if (c && c.aLabel) { ctrlA.textContent = c.aLabel; ctrlA.classList.remove('hidden'); ctrlA.className = 'sim-btn ' + (c.aClass || '') ; }
    else ctrlA.classList.add('hidden');
    if (c && c.bLabel) { ctrlB.textContent = c.bLabel; ctrlB.classList.remove('hidden'); ctrlB.className = 'sim-btn ' + (c.bClass || ''); }
    else ctrlB.classList.add('hidden');
  } else {
    simControlsEl.classList.remove('visible');
  }
  updateReadout();
}

function updateReadout() {
  const s = scenes[currentSceneIdx];
  simReadout.innerHTML = (s.isInteractive && s.readout) ? s.readout() : '';
}

prevBtn.addEventListener("click", () => { if (currentSceneIdx > 0) setScene(currentSceneIdx - 1); });
nextBtn.addEventListener("click", () => { if (currentSceneIdx < scenes.length - 1) setScene(currentSceneIdx + 1); });
resetBtn.addEventListener("click", () => setScene(currentSceneIdx));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" && currentSceneIdx < scenes.length - 1) setScene(currentSceneIdx + 1);
  if (e.key === "ArrowLeft" && currentSceneIdx > 0) setScene(currentSceneIdx - 1);
});
ctrlA.addEventListener("click", () => { const c = scenes[currentSceneIdx].controls; if (c && c.onA) { c.onA(); updateReadout(); } });
ctrlB.addEventListener("click", () => { const c = scenes[currentSceneIdx].controls; if (c && c.onB) { c.onB(); updateReadout(); } });

// =====================================================
//  Draggable sun (pointer + touch)
// =====================================================
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
}
canvas.addEventListener("pointerdown", (e) => {
  const s = scenes[currentSceneIdx];
  if (!s.draggableSun) return;
  const p = canvasPos(e);
  if (Math.hypot(p.x - sun.x, p.y - sun.y) < 70) { dragging = true; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const p = canvasPos(e);
  sun.x = clamp(p.x, 80, W - 80);
  sun.y = clamp(p.y, 50, 340);
});
canvas.addEventListener("pointerup", () => { dragging = false; });
canvas.addEventListener("pointercancel", () => { dragging = false; });
canvas.addEventListener("pointermove", (e) => {
  const s = scenes[currentSceneIdx];
  if (s.draggableSun && !dragging) {
    const p = canvasPos(e);
    canvas.style.cursor = Math.hypot(p.x - sun.x, p.y - sun.y) < 70 ? 'grab' : 'default';
  } else if (dragging) { canvas.style.cursor = 'grabbing'; }
  else { canvas.style.cursor = 'default'; }
});

// =====================================================
//  Main loop
// =====================================================
let lastTs = null;
function tick(ts) {
  if (lastTs == null) lastTs = ts;
  const dt = Math.min(50, ts - lastTs);
  lastTs = ts;
  animT += dt;
  sceneFadeT = Math.min(1, sceneFadeT + dt / 600);
  const s = scenes[currentSceneIdx];
  if (s.update) s.update(dt);
  ctx.save();
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = sceneFadeT;
  s.draw(ctx, animT);
  ctx.restore();
  if (s.isInteractive && s.readout) updateReadout();
  requestAnimationFrame(tick);
}

setScene(0);
requestAnimationFrame(tick);
</script>
</body>
