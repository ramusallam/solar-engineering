function assessPractice(i, value) {
  const Q = PRACTICE[i];
  if (value == null || String(value).trim() === '') return { state: 'no', message: Q.choices ? 'Choose an answer first.' : 'Enter a number first.' };
  if (Q.choices) return value === Q.answer ? { state: 'ok', message: 'Correct. Open the solution and copy the steps into your notebook.' } : { state: 'no', message: Q.wrong };
  const n = numberOf(value);
  if (n == null) return { state: 'no', message: 'Enter just a number. Units are optional.' };
  if (Math.abs(n - Q.answer) < 0.051) return { state: 'ok', message: 'Correct. Open the solution and copy the steps into your notebook.' };

  stageEl.innerHTML = '';
  stageLabel.textContent = s.seeLabel || 'What you see';
  stepHeadingEl.textContent = s.heading;
  stepNumEl.textContent = 'Step ' + pad2(i + 1);
  stepTitleEl.textContent = s.heading;
  notesEl.innerHTML = s.notes;
  notebookTextEl.innerHTML = s.notebook;
  stepIndicator.textContent = `${pad2(i + 1)} / ${pad2(scenes.length)}`;
  progressFill.style.width = ((i + 1) / scenes.length * 100) + '%';
  prevBtn.disabled = i === 0;
  nextBtn.innerHTML = i === scenes.length - 1 ? 'Done' : 'Next ' + ICON.right;
  if (TEACHER) stepJump.value = String(i);
  s.build(stageEl);
  updateGate(); persistWork();
  if (!opts.initial) { window.scrollTo(0, 0); stepHeadingEl.focus({ preventScroll: true }); }
}
prevBtn.addEventListener('click', () => setScene(current - 1));
nextBtn.addEventListener('click', () => { if (current < scenes.length - 1) setScene(current + 1); });
resetBtn.addEventListener('click', () => setScene(0));
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, button, [contenteditable="true"]')) return;
  if (e.key === 'ArrowRight' && current < scenes.length - 1) setScene(current + 1);
  if (e.key === 'ArrowLeft' && current > 0) setScene(current - 1);
});
if (TEACHER) {
  teacherBar.hidden = false;
  scenes.forEach((sc, i) => stepJump.append(el('option', { value: String(i) }, 'Step ' + pad2(i + 1) + '  ·  ' + sc.heading)));
  stepJump.addEventListener('change', () => { const i = Number(stepJump.value); if (!Number.isNaN(i)) setScene(i); });
}
// resume no later than the first unfinished step
let resumeAt = 0;
const saved = Number(WORK.lastScene) || 0;
while (resumeAt < saved && gateFor(resumeAt).complete) resumeAt++;
current = TEACHER ? saved : resumeAt;
setScene(current, { initial: true });
</script>
<script type="module">
/* ===== Class Questions collector =====
   Paste a Firebase web config below to turn on the shared class feed (one project can
   collect every app; rows are tagged by `app`). Leave the PASTE_ values for local demo mode. */
const firebaseConfig = {
  apiKey: "PASTE_FIREBASE_apiKey",
  authDomain: "PASTE_FIREBASE_authDomain",
  projectId: "PASTE_FIREBASE_projectId",
  appId: "PASTE_FIREBASE_appId"
};
const configured = !JSON.stringify(firebaseConfig).includes('PASTE_');
const listeners = {}, key = a => 'classq:' + a;
const readLocal = a => { try { return JSON.parse(localStorage.getItem(key(a)) || '[]'); } catch (e) { return []; } };
const notifyLocal = a => (listeners[a] || []).forEach(cb => cb(readLocal(a)));
function setLocal() {
  window.ClassQ = {
    mode: 'demo',
    async submit(p) { const r = { app: p.app, questions: p.questions || [], created: Date.now() }; const arr = readLocal(r.app); arr.unshift(r); localStorage.setItem(key(r.app), JSON.stringify(arr.slice(0, 300))); notifyLocal(r.app); },
    subscribe(a, cb) { (listeners[a] = listeners[a] || []).push(cb); cb(readLocal(a)); return () => { listeners[a] = (listeners[a] || []).filter(x => x !== cb); }; },
    async clear(a) { localStorage.removeItem(key(a)); notifyLocal(a); }
  };
}
async function init() {
  if (!configured) setLocal();
  else {
    try {
      const appMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      const fs = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const db = fs.getFirestore(appMod.initializeApp(firebaseConfig));
      window.ClassQ = {
        mode: 'live',
        async submit(p) { await fs.addDoc(fs.collection(db, 'questions'), { app: p.app, questions: p.questions || [], created: Date.now() }); },
        subscribe(a, cb) { const qy = fs.query(fs.collection(db, 'questions'), fs.where('app', '==', a), fs.limit(400)); return fs.onSnapshot(qy, snap => { const list = []; snap.forEach(d => list.push(d.data())); list.sort((x, y) => (y.created || 0) - (x.created || 0)); cb(list); }, () => cb([])); },
        async clear(a) { const snap = await fs.getDocs(fs.query(fs.collection(db, 'questions'), fs.where('app', '==', a))); for (const dd of snap.docs) await fs.deleteDoc(dd.ref); }
      };
    } catch (e) { setLocal(); }
  }
  window.dispatchEvent(new Event('classq-ready'));
}
init();
</script>
